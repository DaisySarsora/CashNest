    const code = e && e.code;
    if(code==="quota_exceeded") toast("Storage is full. Delete some old entries and try again.");
    else if(code==="invalid_argument" || code==="not_granted") toast("Couldn't save. You may not have permission to save data on this page.");
    else toast("Couldn't save. Please try again.");

  }
}

/* ---------- charts (inline SVG, hover tooltips) ---------- */
const divsFor = max => { const e = 10**Math.floor(Math.log10(max)), f = Math.round(max/e*10)/10; return (f===2.5||f===5) ? [0,.2,.4,.6,.8,1] : [0,.25,.5,.75,1]; };
const niceMax = v => { if(v<=0) return 1; const e = 10**Math.floor(Math.log10(v)), f = v/e; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e; };
const short = c0 => { const c = conv(c0, PC()).c; const v = c/100, a = Math.abs(v); return a>=1e6 ? (v/1e6).toFixed(a>=1e7?0:1)+"M" : a>=1e3 ? (v/1e3).toFixed(a>=1e4?0:1)+"k" : String(Math.round(v)); };
const topPath = (x,y,w,h,r) => { r = Math.min(r, w/2, h); return h<=0 ? "" : `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`; };
function legend(series){ return series.length<2 ? "" : `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`; }
function barChart({labels, series, stacked=false, height=210, highlight=-1, title=""}){
  const W = 640, H = height, pl = 46, pb = 24, pt = 8, pr = 6, n = labels.length;
  const totals = labels.map((_,i) => stacked ? series.reduce((a,s)=>a+Math.max(0,s.values[i]||0),0) : Math.max(0,...series.map(s=>s.values[i]||0)));
  const max = niceMax(Math.max(...totals, 1)), ph = H-pt-pb, pw = W-pl-pr, slot = pw/n;
  const Y = v => pt + ph - v/max*ph;
  let g = "";
  divsFor(max).forEach(f => { const y = Y(max*f); g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" class="grid"/><text x="${pl-6}" y="${y+3.5}" class="ax" text-anchor="end">${short(max*f)}</text>`; });
  const gw = Math.min(slot*0.72, series.length>1 && !stacked ? 44 : 30);
  const every = Math.ceil(n/12);
  labels.forEach((lab,i) => {
    const cx = pl + slot*i + slot/2, x0 = cx - gw/2;
    if(stacked){
      let acc = 0;
      series.forEach((s,k) => { const v = Math.max(0,s.values[i]||0); if(!v) return;
        const y1 = Y(acc+v), y0 = Y(acc); const top = k===series.length-1 || series.slice(k+1).every(z=>!(z.values[i]>0));
        const h = y0-y1-(acc>0?2:0);
        g += top ? `<path d="${topPath(x0,y1,gw,h,4)}" fill="${s.color}"/>` : `<rect x="${x0}" y="${y1}" width="${gw}" height="${Math.max(0,h)}" fill="${s.color}"/>`;
        acc += v; });
    } else {
      const k = series.length, bw = (gw - 2*(k-1))/k;
      series.forEach((s,j) => { const v = Math.max(0,s.values[i]||0); const y = Y(v);
        g += `<path d="${topPath(x0 + j*(bw+2), y, bw, Y(0)-y, 4)}" fill="${s.color}" ${highlight>=0 && i!==highlight ? 'opacity=".45"' : ""}/>`; });
    }
    if(i % every === 0 || i===n-1) g += `<text x="${cx}" y="${H-7}" class="ax ${i===highlight?"axb":""}" text-anchor="middle">${esc(lab)}</text>`;
    const tip = `<b>${esc(lab)}</b>` + series.map(s=>`<div><i style="background:${s.color}"></i>${esc(s.name)}: <b>${esc(pm(s.values[i]||0))}</b></div>`).join("") + (stacked && series.length>1 ? `<div>Total: <b>${esc(pm(totals[i]))}</b></div>` : "");
    g += `<rect x="${pl+slot*i}" y="${pt}" width="${slot}" height="${ph}" fill="transparent" class="hit" data-tip="${esc(tip)}"/>`;
  });
  g += `<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" class="base"/>`;
  return `<div class="chart">${legend(series)}<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">${g}</svg></div>`;
}
function lineChart({labels, series, ref, height=230, title=""}){
  const W = 640, H = height, pl = 50, pb = 24, pt = 14, pr = 70, n = labels.length;
  const all = series.flatMap(s=>s.values).concat(ref ? [ref.value] : []);
  const max = niceMax(Math.max(...all, 1)), ph = H-pt-pb, pw = W-pl-pr;
  const X = i => pl + (n<=1 ? pw/2 : pw*i/(n-1)), Y = v => pt + ph - Math.max(0,v)/max*ph;
  let g = "";
  divsFor(max).forEach(f => { const y = Y(max*f); g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" class="grid"/><text x="${pl-6}" y="${y+3.5}" class="ax" text-anchor="end">${short(max*f)}</text>`; });
  if(ref){ const y = Y(ref.value); g += `<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" class="refl"/><text x="${W-pr+6}" y="${y+4}" class="ax axb">${esc(ref.label)}</text>`; }
  series.forEach(s => {
    g += `<path d="${s.values.map((v,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join("")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = s.values.length-1; g += `<circle cx="${X(li)}" cy="${Y(s.values[li])}" r="4" fill="${s.color}" stroke="var(--panel)" stroke-width="2"/>`;
    if(!ref) g += `<text x="${X(li)+8}" y="${Y(s.values[li])+4}" class="ax axb">${short(s.values[li])}</text>`;
  });
  const every = Math.ceil(n/10);
  labels.forEach((lab,i) => { if((i % every===0 && n-1-i >= every) || i===n-1) g += `<text x="${X(i)}" y="${H-7}" class="ax" text-anchor="middle">${esc(lab)}</text>`; });
  const step = n>1 ? pw/(n-1) : pw;
  labels.forEach((lab,i) => {
    const tip = `<b>${esc(lab)}</b>` + series.map(s=>`<div><i style="background:${s.color}"></i>${esc(s.name)}: <b>${esc(pm(s.values[i]))}</b></div>`).join("") + (ref ? `<div>${esc(ref.name||ref.label)}: <b>${esc(pm(ref.value))}</b></div>` : "");
    g += `<rect x="${X(i)-step/2}" y="${pt}" width="${step}" height="${ph}" fill="transparent" class="hit" data-tip="${esc(tip)}"/>`;
  });
  g += `<line x1="${pl}" x2="${W-pr}" y1="${Y(0)}" y2="${Y(0)}" class="base"/>`;
  return `<div class="chart">${legend(series)}<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(title)}">${g}</svg></div>`;
}

/* import / export for Daily Spending */
function planSpendImport(sheets){
  const plan = {items:[], problems:[], dupes:0, incomes:0};
  let sh = sheets.find(s=>findHeader(s.rows,["desc","amount"])>=0) || sheets.find(s=>findHeader(s.rows,["desc","credit"])>=0);
  let hi = sh ? Math.max(findHeader(sh.rows,["desc","amount"]), findHeader(sh.rows,["desc","credit"])) : -1, hdr;
  if(sh && hi>=0) hdr = sh.rows[hi];
  else { sh = sheets[0]; hdr = sh && inferColumns(sh.rows); hi = -1; plan.inferred = true;
    if(!hdr){ plan.problems.push("Couldn't find the Description and Amount columns. Add a header row with “Date”, “Description” and “Amount”."); return plan; } }
  const col = {}, extra = [];
  hdr.forEach((h,j) => { const k = hkey(h); if(!k) return;
    const key = ["date","desc","cat","amount","credit","type","bank","method","notes"].find(f => HEAD[f].includes(k) && col[f]==null);
    if(key) col[key] = j; else if(HEAD.desc.includes(k) || HEAD.notes.includes(k)) extra.push(j); });
  if(col.notes==null && extra.length) col.notes = extra.shift();
  const rows = sh.rows.slice(hi+1).map((r,i)=>({r:r||[], n:hi+2+i})).filter(o => o.r.some(c=>c!==""&&c!=null));
  const signs = rows.map(o => cellCents(o.r[col.amount])).filter(v=>v!=null && isFinite(v) && v!==0);
  const mixed = signs.some(v=>v<0) && signs.some(v=>v>0);
  const seen = new Set(S.spend.map(t => `${t.date}|${t.amount}|${(t.desc||"").trim().toLowerCase()}`));
  for(const {r, n} of rows){
    const desc = String(r[col.desc] ?? "").trim();
    if(/^(grand )?totals?$/i.test(desc)) continue;
    let amt = col.amount!=null ? cellCents(r[col.amount]) : null, type = "expense";
    const cr = col.credit!=null ? cellCents(r[col.credit]) : null;
    if((amt==null || amt===0) && cr) { amt = cr; type = "income"; }
    if(amt==null || !isFinite(amt) || amt===0){ plan.problems.push(`Row ${n}${desc?` (${desc})`:""}: amount is missing or not a number`); continue; }
    if(col.type!=null){ const tv = nrm(r[col.type]); if(/^(income|credit|cr|in|deposit)/.test(tv)) type = "income"; else if(tv) type = "expense"; }
    else if(type==="expense" && mixed && amt>0) type = "income";
    amt = Math.abs(amt);
    const date = col.date!=null ? cellDate(r[col.date]) : todayISO();
    if(!date){ plan.problems.push(`Row ${n}: can't read the date “${r[col.date]}”`); continue; }
    const catRaw = col.cat!=null ? r[col.cat] : "";
    let category = type==="income" ? ((INC_CATS.find(([k,,l]) => nrm(catRaw) && (nrm(l).startsWith(nrm(catRaw)) || nrm(catRaw)===k)) || ["otherinc"])[0]) : catKey(catRaw || desc);
    if(type!=="income" && !catRaw) category = guessCat(desc);
    const mv = col.method!=null ? nrm(r[col.method]) : "";
    const method = METHODS.find(x => mv && nrm(x)===mv) || (mv.includes("cash")?"Cash":mv.includes("card")?"Card":mv.includes("bank")||mv.includes("transfer")?"Bank":mv?"Other":"");
    const key = `${date}|${amt}|${desc.toLowerCase()}`;
    if(seen.has(key)){ plan.dupes++; continue; } seen.add(key);
    if(type==="income") plan.incomes++;
    const bank = col.bank!=null ? String(r[col.bank] ?? "").trim() : "";
    plan.items.push({id:uid(), type, date, desc, amount:amt, category, method: method || (bank ? "Card" : ""), ...(bank ? {bank} : {}),
      notes:[col.notes, ...extra].filter(j=>j!=null).map(j=>String(r[j]??"").trim()).filter(Boolean).join(" · "), createdAt:Date.now()+n});
  }
  return plan;
}

/* ---------- My Future ---------- */
const FUT = {age:30, retireAge:60, savings:0, monthly:100000, ret:6, infl:2.5, desired:1000000, withdraw:4, efMonths:6, efSaved:0};
function futurePlan(){
  const f = {...FUT, ...(S.settings.future||{})};
  const years = Math.max(1, (f.retireAge||60) - (f.age||30));
  const real = (1+f.ret/100)/(1+f.infl/100) - 1, mr = Math.pow(1+real, 1/12) - 1;
  const LT = loanTotals(), countLoans = f.countLoans !== false && (LT.owe || LT.owed);
  const start = (f.savings || 0) + (countLoans ? LT.net : 0);
  let bal = start; const ages = [String(f.age)], vals = [Math.round(bal)];
  for(let y=1;y<=years;y++){ for(let i=0;i<12;i++) bal = bal*(1+mr) + (f.monthly||0); ages.push(String(f.age+y)); vals.push(Math.round(bal)); }
  const needed = Math.round((f.desired||0)*12 / (Math.max(0.5,f.withdraw)/100));
  const n = years*12, gF = Math.pow(1+mr, n);
  const reqMonthly = Math.max(0, Math.ceil(mr ? (needed - start*gF) * mr / (gF-1) : (needed - start)/n));
  const supports = Math.round(Math.max(0,bal) * f.withdraw/100 / 12);
  return {f, years, ages, vals:vals.map(v=>Math.max(0,v)), projected:Math.round(bal), needed, gap:needed-Math.round(bal), reqMonthly, supports, LT, countLoans, start};
}
function renderFuture(){
  const P = futurePlan(), f = P.f, ok = P.gap<=0;
  const avg = avgMonthlySpend(3), ess = f.essentials || avg;
  const efTarget = ess * (f.efMonths||6), efCovered = ess ? (f.efSaved||0)/ess : 0;
  const inp = (label, path, kind, val, suffix="") => `<div class="field"><label>${label}</label><div class="sfx"><input class="input" data-setting="future.${path}" data-kind="${kind}" value="${kind==="money"?fromCents(val||0):val}">${suffix?`<span>${suffix}</span>`:""}</div></div>`;
  return `

function pdfKit(title){
  const d = PDF.create(title), k = {d, L:42, R:d.W-42, y:0, MUT:"#6f6c66", POS:"#15803d", NEG:"#c2410c", ACC:"#0f766e", INK:"#1d1d1b"};
  const {L, R} = k;
  k.ensure = (h, again) => { if(k.y+h > d.H-56){ d.addPage(); k.y = 50; if(again) again(); } };
  k.header = (t, sub) => { d.rect(0,0,d.W,8,{fill:k.ACC}); k.y = 58; d.text(L,k.y,t,{size:22,bold:true});
    d.text(R,k.y-12,"CashNest",{size:11,bold:true,color:k.ACC,align:"right"}); d.text(R,k.y+2,`Generated ${fmtDay(todayISO())}`,{size:9,color:k.MUT,align:"right"});
    k.y += 22; if(sub){ d.text(L,k.y,sub,{size:11,color:k.MUT}); k.y += 14; } k.y += 16; };
  k.tiles = arr => { const gap = 8, tw = (R-L-gap*(arr.length-1))/arr.length;
    arr.forEach(([lab,val,col],i) => { const x = L+i*(tw+gap); d.rect(x,k.y,tw,48,{fill:i===arr.length-1?"#e0f2ef":"#f6f4ef"});
      d.text(x+10,k.y+17,lab.toUpperCase(),{size:7.5,bold:true,color:k.MUT}); d.text(x+10,k.y+36,d.fit(val,tw-16,13,true),{size:13,bold:true,color:col||k.INK}); });
    k.y += 70; };
  k.table = (title, cols, rows, foot) => {
    let x = L; const fixed = cols.reduce((a,c)=>a+(c.w||0),0), flexW = R-L-fixed;
    cols.forEach(c => { c.x = x; c.ww = c.w || flexW; x += c.ww; });
    const tx = c => c.align==="right" ? c.x+c.ww-6 : c.x+6;
    const head = () => { d.rect(L,k.y,R-L,20,{fill:"#e0f2ef"}); cols.forEach(c=>d.text(tx(c),k.y+13.5,c.label,{size:7.5,bold:true,color:"#0b4f49",align:c.align})); k.y += 20; };
    k.ensure(64); d.text(L,k.y,title,{size:12.5,bold:true}); k.y += 9; head();
    if(!rows.length){ d.text(L+6,k.y+15,"Nothing in this period",{size:9,color:k.MUT}); k.y += 24; }
    rows.forEach(r => { k.ensure(20, () => { d.text(L,k.y,`${title} (continued)`,{size:10,bold:true,color:k.MUT}); k.y += 9; head(); });
      cols.forEach((c,i) => { const cell = r[i]; const o = typeof cell==="object" && cell ? cell : {v:cell};
        d.text(tx(c),k.y+13.5,d.fit(o.v??"",c.ww-12,9,!!(c.bold||o.bold)),{size:9,bold:!!(c.bold||o.bold),color:o.color||c.color||k.INK,align:c.align}); });
      k.y += 20; d.line(L,k.y,R,k.y); });
    if(foot && rows.length){ k.ensure(24); cols.forEach((c,i)=>{ if(foot[i]) d.text(tx(c),k.y+15,foot[i],{size:9.5,bold:true,align:c.align}); }); k.y += 24; }
    k.y += 16; };
  k.footer = txt => { const n = d.count(); for(let i=0;i<n;i++){ d.onPage(i); d.line(L,d.H-38,R,d.H-38); d.text(L,d.H-24,txt,{size:8,color:k.MUT}); d.text(R,d.H-24,`Page ${i+1} of ${n}`,{size:8,color:k.MUT,align:"right"}); } };
  return k;
}

/* ===================== Supabase mode (used when config.js is filled in) ===================== */
function makeSupabaseDb(sb){
  const subs = new Set();
  const meta = {fromCache:false, hasPendingWrites:false};
  const mapErr = e => ({code: (e && (e.code==="42501" || /row-level security|permission denied/i.test(e.message||""))) ? "invalid_argument" : "unavailable", message: e && e.message || "error"});
  const idOf = p => p.split("/").pop();
  const PAGE = 1000, OVERLAP = 120000, FULL_EVERY = 60*60*1000;
  async function pageAll(build){
    let out = [], from = 0;
    for(;;){ const {data, error} = await build().range(from, from+PAGE-1); if(error) throw mapErr(error);
      out = out.concat(data || []); if(!data || data.length < PAGE) break; from += PAGE; }
    return out;
  }
  const fetchCol = path => pageAll(() => sb.from("docs").select("path,data,updated_at").eq("parent", path).order("path"));
  async function fetchDoc(path){
    const {data, error} = await sb.from("docs").select("path,data").eq("path", path).maybeSingle();
    if(error) throw mapErr(error); return data;
  }
  const colSnap = rows => { const docs = rows.map(r => ({id:idOf(r.path), exists:true, data:()=>r.data, metadata:meta}));
    return {docs, size:docs.length, empty:!docs.length, metadata:meta, docChanges:()=>[]}; };
  const docSnap = (path, row) => ({id:idOf(path), exists:!!row, data:()=>row ? row.data : undefined, metadata:meta});
  const maxTs = (rows, ts) => rows.reduce((m, r) => { const t = Date.parse(r.updated_at) || 0; return t > m ? t : m; }, ts || 0);
  /* collections: one full download, then only what changed since the last check (plus a cheap row count to catch deletions) */
  async function syncCol(s){
    const now = Date.now();
    if(!s.rows || now - s.fullAt > FULL_EVERY){
      const rows = await fetchCol(s.path);
      const next = new Map(rows.map(r => [r.path, {data:r.data, key:JSON.stringify(r.data)}]));
      let changed = !s.rows || next.size !== s.rows.size;
      if(!changed) for(const [p, v] of next){ const o = s.rows.get(p); if(!o || o.key !== v.key){ changed = true; break; } }
      s.rows = next; s.since = maxTs(rows, 0); s.fullAt = now; return changed;
    }
    const since = new Date(Math.max(0, s.since - OVERLAP)).toISOString();
    const delta = await pageAll(() => sb.from("docs").select("path,data,updated_at").eq("parent", s.path).gt("updated_at", since).order("path"));
    let changed = false;
    delta.forEach(r => { const key = JSON.stringify(r.data), o = s.rows.get(r.path); if(!o || o.key !== key){ s.rows.set(r.path, {data:r.data, key}); changed = true; } });
    s.since = maxTs(delta, s.since);
    const {count, error} = await sb.from("docs").select("path", {count:"exact", head:true}).eq("parent", s.path);
    if(error) throw mapErr(error);
    if(count != null && count !== s.rows.size){   // something was deleted: fetch the list of paths only (no data) and drop the missing ones
      const alive = new Set((await pageAll(() => sb.from("docs").select("path").eq("parent", s.path).order("path"))).map(r => r.path));
      for(const p of [...s.rows.keys()]) if(!alive.has(p)){ s.rows.delete(p); changed = true; }
      if(alive.size !== s.rows.size){ s.fullAt = 0; return syncCol(s); }   // still off: start over with a full download
    }
    return changed;
  }
  async function refresh(s){
    if(s.busy){ s.again = true; return; }
    s.busy = true;
    try {
      if(s.kind==="col"){
        const changed = await syncCol(s);
        if((changed || !s.sent) && subs.has(s)){ s.sent = true; s.last = 1;
          s.cb(colSnap([...s.rows.entries()].sort((a,b)=>a[0]<b[0]?-1:1).map(([path, v]) => ({path, data:v.data})))); }
      } else {
        const v = await fetchDoc(s.path), key = JSON.stringify(v);
        if(key !== s.last && subs.has(s)){ s.last = key; s.cb(docSnap(s.path, v)); }
      }
    } catch(e){ if(s.last===undefined && !s.failed){ s.failed = true; s.err && s.err(e); } }
    finally { s.busy = false; if(s.again){ s.again = false; refresh(s); } }
  }
  const refreshAll = () => subs.forEach(refresh);
  let t = null; const refreshSoon = () => { clearTimeout(t); t = setTimeout(refreshAll, 250); };
  setInterval(() => { if(!document.hidden) refreshAll(); }, 15000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) refreshAll(); });
  window.addEventListener("focus", refreshSoon);
  function collection(path){
    return { path,
      onSnapshot(cb, err){ const s = {kind:"col", path, cb, err}; subs.add(s); refresh(s); return () => subs.delete(s); },
      async get(){ const live = [...subs].find(s => s.kind==="col" && s.path===path && s.rows);
        if(live){ await refresh(live); return colSnap([...live.rows.entries()].map(([p, v]) => ({path:p, data:v.data}))); }
        return colSnap(await fetchCol(path)); },
      doc(id){ return doc(`${path}/${id}`); } };
  }
  function doc(path){
    return { id:idOf(path), path,
      async get(){ return docSnap(path, await fetchDoc(path)); },
      async set(obj){ const {error} = await sb.from("docs").upsert({path, data:obj}); if(error) throw mapErr(error); refreshSoon(); },
      async delete(){ const {error} = await sb.from("docs").delete().eq("path", path); if(error) throw mapErr(error); refreshSoon(); },
      onSnapshot(cb, err){ const s = {kind:"doc", path, cb, err}; subs.add(s); refresh(s); return () => subs.delete(s); },
      collection(name){ return collection(`${path}/${name}`); } };
  }
  return {doc, collection, refreshAll, refreshSoon};
}

async function bootSupabase(cfg){
  try { await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"); }
  catch { root.innerHTML = `<div class="loading">Couldn't load the sign-in library. Check your internet connection and refresh.</div>`; return null; }
  if(/type=recovery/.test(location.hash + location.search)){ try { sessionStorage.setItem("cashnest-recovery", "1"); } catch {} }
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  let recovering = false;
  sb.auth.onAuthStateChange(ev => { if(ev==="PASSWORD_RECOVERY"){ recovering = true; try { sessionStorage.setItem("cashnest-recovery", "1"); } catch {} } });
  const q = new URLSearchParams(location.search), join = q.get("join");
  if(join){ try { localStorage.setItem("cashnest-join", join); } catch {} history.replaceState(null, "", location.pathname + location.hash); }
  const {data:{session}} = await sb.auth.getSession();
  let rec = recovering; try { rec = rec || sessionStorage.getItem("cashnest-recovery")==="1"; } catch {}
  if(session && rec){ if(/access_token|type=recovery/.test(location.hash)) history.replaceState(null, "", location.pathname); renderLogin(sb, "newpass", "", session.user.email || ""); return null; }
  if(!session){
    renderLogin(sb, "signin", join ? "Sign in or create an account to join the group you were invited to." : "");
    sb.auth.onAuthStateChange((ev, s) => { if(s) location.reload(); });
    return null;
  }
  sb.auth.onAuthStateChange(ev => { if(ev==="SIGNED_OUT") location.reload(); });
  S.sb = sb; S.userEmail = session.user.email || "";
  return {db: makeSupabaseDb(sb), userId: session.user.id};
}

function importsOf(list){

function bindImports(ov, m){

    const imp = importsOf(m.kind==="g" ? S.expenses : S.spend).find(x=>x.id===b.dataset.impdel); if(!imp) return;
    if(b.dataset.armed!=="1"){ b.dataset.armed = "1"; b.textContent = `Click again to delete ${imp.items.length} item${imp.items.length>1?"s":""}`; return; }
    b.disabled = true;
    const ok = await bulkDelete(m.kind, imp.items.map(x=>x.id), n => b.textContent = `Deleting ${n}/${imp.items.length}…`);
    if(ok) closeModal();

}
async function bulkDelete(kind, ids, progress){
  if(kind==="sp" && ids.some(id => id.startsWith("sh:"))){
    const sh = ids.filter(id => id.startsWith("sh:")), own = ids.filter(id => !id.startsWith("sh:"));
    const keys = sh.map(id => id.slice(3)); sh.forEach(id => S.spSel.ids.delete(id));
    await hideShared(keys);
    if(own.length) return bulkDelete(kind, own, progress);
    toast(`Hidden ${keys.length} shared item${keys.length>1?"s":""} from Daily Spending`); render(); return true;
  }
  const n = ids.length; if(!n) return true;
  const g = group(), msg = `Deleted ${n} item${n>1?"s":""}`;
  const run = async () => { for(let i=0;i<n;i++){ progress && progress(i+1);
    if(kind==="g") await S.store.deleteExpense(g.id, ids[i]); else await S.pStore.del("spending", ids[i]); } };
  const ok = kind==="g" ? await write(run, msg) : await writeP(run, msg);
  if(ok){ const st = kind==="g" ? S.sel : S.spSel; ids.forEach(id => st.ids.delete(id)); }
  render(); return ok;
}
function selClick(t){
  const k = t.dataset.selall || t.dataset.selclear || t.dataset.seldel || t.dataset.seldone;
  if(k){
    const st = k==="g" ? S.sel : S.spSel;
    if(t.dataset.selall){ S._shown[k].forEach(id => st.ids.add(id)); render(); return true; }
    if(t.dataset.selclear){ st.ids.clear(); render(); return true; }
    if(t.dataset.seldone){ st.on = false; st.ids.clear(); render(); return true; }
    if(t.dataset.seldel){
      if(t.dataset.armed!=="1"){ t.dataset.armed = "1"; t.textContent = `Click again to delete ${st.ids.size}`; return true; }
      t.disabled = true; bulkDelete(k, [...st.ids], i => t.textContent = `Deleting ${i}/${st.ids.size}…`); return true;
    }
  }
  if(t.dataset.exp && S.sel.on && S.module==="split-share"){ const id = t.dataset.exp; S.sel.ids.has(id) ? S.sel.ids.delete(id) : S.sel.ids.add(id); render(); return true; }
  if(t.dataset.sp && S.spSel.on && S.module==="daily-spending"){ const id = t.dataset.sp; S.spSel.ids.has(id) ? S.spSel.ids.delete(id) : S.spSel.ids.add(id); render(); return true; }
  switch(t.dataset.act){
    case "sel-g": S.sel.on = !S.sel.on; S.sel.ids.clear(); render(); return true;
    case "sel-sp": S.spSel.on = !S.spSel.on; S.spSel.ids.clear(); render(); return true;
    case "imports-g": if(group()) openModal({type:"imports", kind:"g"}); return true;
    case "bulk-split": { const g = group(); if(!g || !selectedExpenses().length){ toast("Select at least one expense (payments can't be split)."); return true; }
      const inputs = {}; g.members.forEach(p=>inputs[p.id]=true); openModal({type:"bulksplit", method:"equal", inputs, paidBy:""}); return true; }
    case "bulk-cat-g": if(!selectedExpenses().length){ toast("Select at least one expense (payments don't have a category)."); return true; } openModal({type:"bulkcat", kind:"g"}); return true;
    case "bulk-cat-sp": openModal({type:"bulkcat", kind:"sp"}); return true;
    case "bulk-bank-g": if(!selectedExpenses().length){ toast("Select at least one expense (payments don't have a bank)."); return true; } openModal({type:"bulkbank", kind:"g", bank:""}); return true;
    case "bulk-bank-sp": if(!S.spend.some(x => S.spSel.ids.has(x.id))){ toast("Shared items take their bank from the group expense. Select your own items."); return true; } openModal({type:"bulkbank", kind:"sp", bank:""}); return true;
    case "imports-sp": openModal({type:"imports", kind:"sp"}); return true;
    case "shared-set": openModal({type:"sharedset"}); return true;
  }
  return false;
}

/* ---------- expense filters (Split & Share) ---------- */
S.gf = {paid:"", who:"", period:"", from:"", to:"", split:""};
const filtersActive = () => Object.values(S.gf).some(v => v);
function passesFilters(e){
  const F = S.gf;
  if(F.paid && (e.kind==="settle" ? e.from : e.paidBy) !== F.paid) return false;
  if(F.who){ if(e.kind==="settle"){ if(e.from!==F.who && e.to!==F.who) return false; } else if(!((e.splits||{})[F.who] > 0)) return false; }
  if(F.period){
    const d = e.date || "", cm = thisMonth();
    if(F.period==="this" && monthOf(d)!==cm) return false;
    if(F.period==="last" && monthOf(d)!==addMonths(cm,-1)) return false;
    if(F.period==="custom"){ if(F.from && d < F.from) return false; if(F.to && d > F.to) return false; }
  }
  if(F.split){ if(e.kind==="settle") return false;
    if(F.split==="unsplit" ? !isUnsplit(e) : (isUnsplit(e) || (e.splitType||"exact")!==F.split)) return false; }
  return true;
}

function bindCats(ov){
  const $ = s => ov.querySelector(s);
  const collect = () => {
    const st = JSON.parse(JSON.stringify((S.settings||{}).cats || {})); st.edit = st.edit || {}; st.custom = st.custom || [];
    ov.querySelectorAll("[data-clabel]").forEach(inp => { const k = inp.dataset.clabel, label = inp.value.trim(), icon = ov.querySelector(`[data-cicon="${k}"]`).value.trim();
      const cu = st.custom.find(c=>c.k===k);
      if(cu){ if(label) cu.label = label; cu.icon = icon || cu.icon; return; }
      const base = BASE_CATS.find(c=>c[0]===k);
      if(label && (label!==base[2] || icon!==base[1])) st.edit[k] = {label, icon: icon || base[1]}; else delete st.edit[k]; });
    return st;
  };
  ov.querySelectorAll("[data-cmemoji]").forEach(b => b.onclick = () => { $("#cm-icon").value = b.dataset.cmemoji; });
  const addNew = () => { const name = $("#cm-name").value.trim(); if(!name) return $("#cm-name").focus();
    if(CATEGORIES.some(c => nrm(c[2])===nrm(name))) return $("#cm-err").textContent = "There's already a category with that name.";
    const st = collect(); st.custom.push({k:"c_"+uid(), icon:$("#cm-icon").value.trim()||"🏷️", label:name}); saveSetting("cats", st); applyCats(true); toast(`Category “${name}” added`); setTimeout(renderModal, 20); };
  $("[data-cmadd]").onclick = addNew; $("#cm-name").onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); addNew(); } };
  ov.querySelectorAll("[data-creset]").forEach(b => b.onclick = () => { const st = collect(); delete st.edit[b.dataset.creset]; saveSetting("cats", st); applyCats(true); setTimeout(renderModal, 20); });
  ov.querySelectorAll("[data-cdel]").forEach(b => b.onclick = () => {
    if(b.dataset.armed!=="1"){ b.dataset.armed = "1"; b.textContent = "Delete?"; return; }
    const st = collect(); st.custom = st.custom.filter(c => c.k !== b.dataset.cdel); saveSetting("cats", st); applyCats(true); toast("Category deleted"); setTimeout(renderModal, 20); });
  $("[data-cmsave]").onclick = () => { const st = collect(); saveSetting("cats", st); applyCats(true); toast("Categories saved"); closeModal(); };
}

/* banks you've used anywhere, for suggestions */
function allBanks(){
  const s = new Set();
  (S.spend||[]).forEach(x => x.bank && s.add(x.bank));
  (S.loans||[]).forEach(l => { if(l.bank) s.add(l.bank); else if(!l.card && l.dir==="owe") s.add(l.name); });
  Object.values(S.groupExp||{}).forEach(list => (list||[]).forEach(e => e.bank && s.add(e.bank)));
  return [...s].sort((a,b)=>a.localeCompare(b));
}

/* ---------- bulk split / bulk category ---------- */
const selectedExpenses = () => S.expenses.filter(e => S.sel.ids.has(e.id) && e.kind!=="settle");
function bulkSplitWeights(m, g){
  const w = {};
  if(m.method==="equal") g.members.forEach(p => { if(m.inputs[p.id]===true) w[p.id] = 1; });
  else g.members.forEach(p => { const v = parseFloat(m.inputs[p.id]); if(v>0) w[p.id] = v; });
  return w;
}
function bulkSplitCheck(m, g){
  const w = bulkSplitWeights(m, g), sum = Object.values(w).reduce((a,v)=>a+v,0);
  if(!Object.keys(w).length) return {ok:false, msg: m.method==="equal" ? "Pick at least one person." : "Give at least one person a value."};
  if(m.method==="percent" && Math.abs(sum-100) > 0.001) return {ok:false, msg:`Percentages add up to ${Math.round(sum*100)/100}%, they need to make 100%.`, w};
  return {ok:true, w};
}
function bulkSplitModal(m){
  const g = group(), list = selectedExpenses(), skipped = S.sel.ids.size - list.length;
  const total = list.reduce((a,e)=>a+e.amount,0), chk = bulkSplitCheck(m, g);
  const per = {}; if(chk.ok) list.forEach(e => { const s = allocate(e.amount, chk.w); Object.entries(s).forEach(([id,c]) => per[id] = (per[id]||0) + c); });
  const methods = [["equal","Equally"],["percent","%"],["shares","Shares"]];
  return `<header><h3>Split ${list.length} expense${list.length>1?"s":""} the same way</h3><button class="btn ghost sm" data-close>✕</button></header>
  <div class="body">
    <div class="s">Total ${money(total,g.currency)}${skipped?` · ${skipped} payment${skipped>1?"s":""} skipped (payments aren't split)`:""}. Each expense is split separately using the same rule. Exact amounts aren't offered here because every expense has a different total.</div>
    <div class="field"><label>Split</label><div class="seg">${methods.map(([k,l])=>`<button type="button" data-bm="${k}" class="${m.method===k?"on":""}">${l}</button>`).join("")}</div></div>
    <div class="splits">
      ${m.method==="equal" ? allRow(g, m.inputs, "data-allbulk") : ""}
      ${g.members.map(p => `<div class="sp">
        ${m.method==="equal" ? `<input type="checkbox" data-bin="${esc(p.id)}" ${m.inputs[p.id]===true?"checked":""}>` : av(p,g.members)}
        <div>${esc(p.name)}</div>
        ${m.method==="equal" ? `<div class="share">${per[p.id]?money(per[p.id],g.currency):"—"}</div>`
          : `<div style="display:flex;flex-direction:column;align-items:flex-end;gap:2px"><input class="input" type="number" min="0" step="${m.method==="percent"?"0.01":"1"}" data-bin="${esc(p.id)}" value="${esc(m.inputs[p.id]??"")}" placeholder="${m.method==="percent"?"%":"0"}"><span class="share">${per[p.id]?money(per[p.id],g.currency):""}</span></div>`}
      </div>`).join("")}
      <div class="split-status"><span>${m.method==="equal" ? `${Object.keys(bulkSplitWeights(m,g)).length} people` : m.method==="percent" ? `${Math.round(Object.values(bulkSplitWeights(m,g)).reduce((a,v)=>a+v,0)*100)/100}% of 100%` : `${Object.values(bulkSplitWeights(m,g)).reduce((a,v)=>a+v,0)} shares`}</span><span class="${chk.ok?"pos":"neg"}">${chk.ok?"✓ Ready":""}</span></div>
    </div>
    <div class="field"><label>Paid by</label><select class="input" id="bs-paid"><option value="">Keep as it is on each expense</option>${g.members.map(p=>`<option value="${esc(p.id)}" ${m.paidBy===p.id?"selected":""}>${esc(p.name)} paid for all of them</option>`).join("")}</select></div>
    <div class="err" id="bs-err">${chk.ok?"":esc(chk.msg||"")}</div>
  </div>
  <footer><span></span><div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn primary" data-bsdo ${chk.ok&&list.length?"":"disabled"}>Split ${list.length} expense${list.length>1?"s":""}</button></div></footer>`;
}
function bindBulkSplit(ov, m){
  const g = group(), $ = s => ov.querySelector(s);
  ov.querySelectorAll("[data-bm]").forEach(b => b.onclick = () => { if(m.method===b.dataset.bm) return; m.method = b.dataset.bm; m.inputs = {};
    if(m.method==="equal") g.members.forEach(p=>m.inputs[p.id]=true);
    if(m.method==="shares") g.members.forEach(p=>m.inputs[p.id]="1");
    if(m.method==="percent") g.members.forEach(p=>m.inputs[p.id]=String(Math.round(10000/g.members.length)/100));
    renderModal(); });

/* ===================== My Loans ===================== */
/* A loan: {id, dir:"owe"|"owed", name, purpose, cur, principal, rate, monthly, dueDay, start, notes, entries:[{id,date,kind,amount,note,spendId}], createdAt}
   kind: "pay" (balance down)  ·  "add" (balance up: interest/fees on a loan I owe, or more money lent). Amounts are in the loan's own currency. */
S.loans = [];
const loanBalance = l => Math.max(0, (l.principal||0) + (l.entries||[]).reduce((a,e) => a + (e.kind==="add" ? e.amount : -e.amount), 0));
const loanPaid = l => (l.entries||[]).filter(e=>e.kind==="pay").reduce((a,e)=>a+e.amount, 0);
const loanTotal = l => (l.principal||0) + (l.entries||[]).filter(e=>e.kind==="add").reduce((a,e)=>a+e.amount, 0);
const inPC = (c, cur) => toBase(c, cur||PC(), PC());
/* what Split & Share says you owe / are owed (the group's "how to settle" transfers that involve you) */
const splitSync = () => (S.settings||{}).loanSplit !== false;
function splitDebts(){
  const out = [];
  for(const g of S.groups||[]){
    const ex = (S.groupExp||{})[g.id] || (g.id===S.gid ? S.expenses : null); if(!ex || !ex.length) continue;
    const me = meIn(g); if(!me) continue;
    simplify(computeBalances(g, ex).bal).forEach(t => {
      if(t.from===me.id) out.push({dir:"owe", gid:g.id, gname:g.name, pid:t.to, me:me.id, person:memberName(g,t.to), amount:toBase(t.amount, g.currency, PC()), orig:t.amount, cur:g.currency});
      else if(t.to===me.id) out.push({dir:"owed", gid:g.id, gname:g.name, pid:t.from, me:me.id, person:memberName(g,t.from), amount:toBase(t.amount, g.currency, PC()), orig:t.amount, cur:g.currency});
    });
  }
  return out;
}
function loanTotals(){
  let owe = 0, owed = 0, monthly = 0, debtFree = null;
  if(splitSync()) splitDebts().forEach(d => { if(d.dir==="owe") owe += d.amount; else owed += d.amount; });
  S.loans.forEach(l => { const b = inPC(loanBalance(l), l.cur); if(!b) return;
    if(l.dir==="owe"){ owe += b; monthly += inPC(l.monthly||0, l.cur); const p = payoff(l); if(p.date && (!debtFree || p.date > debtFree)) debtFree = p.date; if(p.never) debtFree = "never"; }
    else owed += b; });
  return {owe, owed, net: owed - owe, monthly, debtFree};
}
/* ---- payment schedule: first payment date → last payment date, one instalment a month ----
   Instalments paid = everything paid ÷ the monthly amount, so paying early (e.g. paying the 5 Nov instalment in October) counts right away. */
const dayOf = iso => Number(String(iso||"").slice(8,10)) || 1;
const dateInMonth = (ym, day) => `${ym}-${String(Math.min(day, daysIn(ym))).padStart(2,"0")}`;
function firstDueDate(l){
  if(l.firstDue) return l.firstDue;
  const day = l.dueDay || (l.start ? dayOf(l.start) : 1);
  return dateInMonth(l.start ? addMonths(monthOf(l.start), 1) : thisMonth(), day);
}
const dueAt = (l, k) => dateInMonth(addMonths(monthOf(firstDueDate(l)), k), l.dueDay || dayOf(firstDueDate(l)));
function monthsBetween(a, b){ let n = 0, m = a; while(m <= b && n < 1200){ n++; m = addMonths(m, 1); } return n; }
function instPaid(l){
  const pays = (l.entries||[]).filter(e => e.kind==="pay");
  if(l.monthly > 0) return Math.floor(pays.reduce((a,e)=>a+e.amount,0) / l.monthly + 1e-6);
  return pays.filter(e => !e.opening).length;
}
const scheduleCount = l => l.endDate ? monthsBetween(monthOf(firstDueDate(l)), monthOf(l.endDate)) : null;
function paymentsLeft(l){ const n = scheduleCount(l); return n==null ? null : Math.max(0, n - instPaid(l)); }
function nextDue(l){
  if(!loanBalance(l) || (!l.dueDay && !l.firstDue && !l.endDate)) return null;
  const k = instPaid(l), n = scheduleCount(l);
  if(n!=null && k >= n) return null;
  return dueAt(l, k);
}
/* monthly amount that clears balance B in n payments at yearly rate (%) */
function monthlyFor(B, n, rate){ if(!n || n<1) return 0; const r = (rate||0)/100/12; return Math.ceil(r ? B*r/(1-Math.pow(1+r,-n)) : B/n); }

/* months to clear the balance at the monthly payment, with monthly interest */
function payoff(l){
  if(l.endDate && loanBalance(l)){ const n = paymentsLeft(l);
    return {months:n, date:monthOf(l.endDate), scheduled:true, total:(l.monthly||0)*n, interest: Math.max(0, (l.monthly||0)*n - loanBalance(l))}; }
  const B = loanBalance(l), M = l.monthly||0, r = (l.rate||0)/100/12;
  if(!B) return {months:0, date:null, done:true};
  if(!M) return {months:null, date:null};
  if(r && M <= B*r) return {months:null, date:null, never:true};
  const n = r ? Math.ceil(-Math.log(1 - r*B/M) / Math.log(1+r)) : Math.ceil(B/M);
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + n);
  const iso = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  return {months:n, date:iso, interest: r ? Math.max(0, n*M - B) : 0};
}
/* this month's instalment: due, overdue, or already paid */
function dueInfo(l){
  if(l.dir!=="owe" || !loanBalance(l)) return null;
  const nd = nextDue(l); if(!nd) return null;
  const t = todayISO(), ym = t.slice(0,7);
  if(monthOf(nd) <= ym) return {date:nd, paid:false, overdue: nd < t, daysLeft: Math.round((Date.parse(nd) - Date.parse(t)) / 864e5)};
  const k = instPaid(l); if(k > 0){ const prev = dueAt(l, k-1); if(monthOf(prev)===ym) return {date:prev, paid:true}; }
  return null;
}
const lm = (c, l) => money(c, l.cur||PC());

function renderLoans(){
  const T = loanTotals();
  const open = d => S.loans.filter(l => l.dir===d && !l.card && loanBalance(l) > 0);
  const cardPlans = S.loans.filter(l => l.card && loanBalance(l) > 0);
  const cards = [...new Set(cardPlans.map(l=>l.name))];
  const closed = S.loans.filter(l => loanBalance(l) === 0);
  const dues = S.loans.map(l => ({l, d:dueInfo(l)})).filter(x => x.d).sort((a,b)=>a.d.date.localeCompare(b.d.date));
  const df = T.debtFree==="never" ? "Not at this rate" : T.debtFree ? monthName(T.debtFree) : (T.owe ? "Add monthly payments" : "Debt-free ✓");
  return `
    ${modHead("My Loans", "What you owe, and what other people owe you.",
      `<button class="btn sm" data-act="loan-new-owed">＋ Money owed to me</button><button class="btn sm" data-act="loan-new-card">💳 ＋ Credit card plan</button><button class="btn sm primary" data-act="loan-new-owe">＋ Loan I owe</button>`)}
    <div class="stats four">
      ${tile("You owe", pm(T.owe), T.owe?"neg":"", T.monthly ? `${pm(T.monthly)} a month in payments` : "")}
      ${tile("Owed to you", pm(T.owed), T.owed?"pos":"")}
      ${tile(T.net>=0?"Net: in your favour":"Net: you owe", pm(Math.abs(T.net)), T.net>=0?"pos":"neg", "owed to you minus what you owe")}
      ${tile("Debt-free by", df, T.debtFree==="never"?"neg":"", T.debtFree==="never" ? "a payment is too small to beat the interest" : "")}
    </div>
    ${dues.length ? `<h3 class="sec">This month's payments</h3><div class="card" style="margin-bottom:20px">${dues.map(({l,d}) => `
      <div class="srow">
        <span class="cat sm">${l.card?"💳":"🏦"}</span>

function peopleLedger(){

  (S.groups||[]).forEach(g => { const me = meIn(g); g.members.forEach(m => { if(!me || m.id!==me.id) memberKeys.add(personKey(m.name)); }); });
  const get = name => { const k = personKey(name); if(!k) return null;
    if(!map.has(k)) map.set(k, {key:k, name, loans:[], split:[], owed:0, owe:0});
    const p = map.get(k); if(String(name).length > String(p.name).length) p.name = name; return p; };
  S.loans.filter(l => !l.card && loanBalance(l) > 0).forEach(l => {
    if(l.dir==="owe" && !memberKeys.has(personKey(l.name)) && !S.loans.some(x => x.dir==="owed" && personKey(x.name)===personKey(l.name))) return; // banks etc. stay in their own section

/* live hint in the loan form: work out the monthly amount or the end date */
function loanDraftBalance(m){
  const prev = S.loans.find(x=>x.id===m.id), principal = toCents(m.principal), already = m.already ? toCents(m.already) : 0;
  if(!isFinite(principal) || principal<=0) return null;
  if(prev){ const changed = principal - (prev.principal||0); return Math.max(0, loanBalance(prev) + changed); }
  return Math.max(0, principal - (isFinite(already)?already:0));
}
function loanDraft(m){
  const prev = S.loans.find(x=>x.id===m.id);
  const monthly = m.monthly ? toCents(m.monthly) : 0, already = m.already ? toCents(m.already) : 0;
  const entries = prev ? (prev.entries||[]) : (already>0 && isFinite(already) ? [{kind:"pay", amount:already, opening:true, date:m.start||todayISO()}] : []);
  const due = m.dueDay ? parseInt(m.dueDay,10) : (m.firstDue ? dayOf(m.firstDue) : 0);
  return {start:m.start, firstDue:m.firstDue||null, endDate:m.endDate||null, dueDay:due||null, monthly:isFinite(monthly)?monthly:0, entries};
}
function loanHint(m){
  const B = loanDraftBalance(m); if(B==null) return "";
  const rate = m.rate ? parseFloat(m.rate)||0 : 0, cur = m.cur||PC(), d = loanDraft(m);
  if(!B) return "Nothing left to pay.";
  if(m.endDate){
    const total = scheduleCount(d); if(total < 1) return "The last payment date should be after the first payment date.";
    const fd = firstDueDate(d);
    if(!d.monthly){
      const left = total - d.entries.filter(e=>e.kind==="pay"&&!e.opening).length;
      return `${total} instalments from ${fmtDay(fd)} to ${fmtDay(m.endDate)} · ≈ ${moneyFull(monthlyFor(B, Math.max(1,left), rate), cur)} a month for the ${left} left (leave Monthly empty and I'll use this)`;
    }
    const paidN = instPaid(d), left = Math.max(0, total - paidN), need = d.monthly*left, nd = left ? dueAt(d, paidN) : null;
    let s = `${total} instalments (${fmtDay(fd)} → ${fmtDay(m.endDate)})${paidN?` · ${paidN} paid`:""} · <b>${left} left</b> × ${moneyFull(d.monthly, cur)} = ${moneyFull(need, cur)}`;
    if(nd) s += ` · next due ${fmtDay(nd)}`;
    s += Math.abs(need-B) > Math.max(100, B*0.01) ? (need>B ? ` · ${moneyFull(need-B, cur)} more than the balance (interest or fees)` : ` · <span class="neg">${moneyFull(B-need, cur)} short of the balance</span>`) : " ✓";
    return s;
  }
  if(d.monthly){ const p = payoff({principal:B, entries:[], monthly:d.monthly, rate}); return p.never ? "At this monthly amount the interest grows faster than the payments." : p.date ? `At this amount it'll be ${m.dir==="owe"?"paid off":"repaid"} by ${monthName(p.date)} (${p.months} months)` : ""; }
  return "";
}

const OTHER = "\u0000other";
function cfSettings(){
  const cf = S.settings.cf || {}, cm = thisMonth();
  const bud = (S.settings.budget||{}).income;
  return {from: cf.from || addMonths(cm,-2), to: cf.to || addMonths(cm,9), opening: cf.opening || 0,
    income: bud != null && bud !== 0 ? bud : (cf.income || 0), useExpected: cf.useExpected !== false, useBudget: cf.useBudget !== false, useRepay: cf.useRepay !== false};
}
/* the instalment a loan schedules for month m (in your currency), or 0 */
function scheduledIn(l, m){
  if(!l.monthly) return 0;
  const start = monthOf(firstDueDate(l));
  let end = l.endDate ? monthOf(l.endDate) : null;
  if(!end){ const p = payoff(l); if(p.date) end = p.date; else if(p.done) end = addMonths(thisMonth(), -1); }
  if(m < start || (end && m > end)) return 0;

  return inPC(l.monthly, l.cur);
}
function cashFlow(){

    ${m.add ? `<div class="row2">

      <div class="field"><label>Month</label><select class="input" id="cb-month">${monthsOpt.map(x=>`<option value="${x}" ${x===m.ym?"selected":""}>${monthName(x)}</option>`).join("")}</select></div></div>` : ""}
    <div class="field"><label>Budget for the whole month (${esc(PC())})</label><input class="input amount-in" id="cb-amt" inputmode="decimal" value="${cur!=null ? fromCents(cur) : def ? fromCents(def) : ""}" placeholder="0.00"><div class="calc" id="cb-calc"></div></div>
    ${spent ? `<div class="s">Already spent this month: <b>${pm(spent)}</b>. Only what's left of the budget is counted in the cash flow.</div>` : ""}
    <div class="seg" style="flex-direction:column;gap:3px">
      <button type="button" data-cbscope="one" class="${m.scope==="one"?"on":""}" style="text-align:left;padding:8px 10px">Only this month</button>
      <button type="button" data-cbscope="after" class="${m.scope==="after"?"on":""}" style="text-align:left;padding:8px 10px">This month and every later month in this period</button>
      <button type="button" data-cbscope="all" class="${m.scope==="all"?"on":""}" style="text-align:left;padding:8px 10px">Every month: change my usual limit in My Budget</button>
    </div>
    <div class="s">Usual limit in My Budget: ${def ? pm(def) : "not set"}.</div>
    <div class="err" id="cb-err"></div>
  </div>
  <footer>${cur!=null && !m.add ? `<button class="btn danger ghost" data-cbreset>Reset this month</button>` : "<span></span>"}
    <div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn primary" data-cbsave>Save</button></div></footer>`;
}
function bindCfBud(ov, m){
  const $ = s => ov.querySelector(s);
  $("#cb-amt").oninput = () => { $("#cb-calc").innerHTML = calcPreview($("#cb-amt").value, {currency:PC()}); };
  ov.querySelectorAll("[data-cbscope]").forEach(b => b.onclick = () => { m.scope = b.dataset.cbscope; ov.querySelectorAll("[data-cbscope]").forEach(x=>x.classList.toggle("on", x===b)); });
  if($("#cb-cat")) $("#cb-cat").onchange = e => { m.cat = e.target.value; m.ym = $("#cb-month").value; renderModal(); };
  if($("#cb-month")) $("#cb-month").onchange = e => { m.ym = e.target.value; };
  $("[data-cbsave]").onclick = async () => {
    if($("#cb-cat")){ m.cat = $("#cb-cat").value; m.ym = $("#cb-month").value; }
    const a = toCents($("#cb-amt").value);
    if(!isFinite(a) || a < 0) return $("#cb-err").textContent = "Enter an amount (0 or more).";
    const C = cfSettings(), OV = JSON.parse(JSON.stringify(budOv())), label = (CAT[m.cat]||CAT.other).label;
    if(m.scope==="all"){
      for(let x = m.ym; x <= addMonths(C.to, 24); x = addMonths(x,1)) if(OV[x]) { delete OV[x][m.cat]; if(!Object.keys(OV[x]).length) delete OV[x]; }
      const next = JSON.parse(JSON.stringify(S.settings||{}));
      setPath(next, `budget.limits.${m.cat}`, a); setPath(next, "cf.budgetByMonth", OV);
      S.settings = next; setTimeout(render); await writeP(() => S.pStore.saveSettings(S.settings));
      toast(`${label}: usual limit set to ${pm(a)}`); closeModal(); return;
    }
    const list = []; if(m.scope==="after"){ for(let x = m.ym; x <= C.to; x = addMonths(x,1)) list.push(x); } else list.push(m.ym);
    list.forEach(x => { (OV[x] ||= {})[m.cat] = a; });
    saveSetting("cf.budgetByMonth", OV); toast(list.length>1 ? `${label}: ${pm(a)} for ${list.length} months` : `${label}: ${pm(a)} for ${monthName(m.ym)}`); closeModal();
  };
  const r = $("[data-cbreset]"); if(r) r.onclick = () => { const OV = JSON.parse(JSON.stringify(budOv())); if(OV[m.ym]){ delete OV[m.ym][m.cat]; if(!Object.keys(OV[m.ym]).length) delete OV[m.ym]; } saveSetting("cf.budgetByMonth", OV); toast("Back to the usual limit"); closeModal(); };
  setTimeout(() => { const i = $("#cb-amt"); i.focus(); i.select(); });
}
EXTRA_MODALS.cfbud = [cfBudModal, bindCfBud];
function cfClick(t){
  if(t.dataset.cflayout){ saveSetting("cf.layout", t.dataset.cflayout); return true; }
  if(t.dataset.cfcompact){ saveSetting("cf.compact", t.dataset.cfcompact==="1"); if(t.dataset.cfcompact==="0") saveSetting("cf.collapsed", {}); return true; }
  if(t.dataset.cfcol){ const c = {...((S.settings.cf||{}).collapsed||{})}; if(c[t.dataset.cfcol]) delete c[t.dataset.cfcol]; else c[t.dataset.cfcol] = 1; saveSetting("cf.collapsed", c); return true; }
  if(t.dataset.cfinc){ openModal({type:"cfinc", ym:t.dataset.cfinc, scope:"one"}); return true; }
  if(t.dataset.cfbud){ const [ym, cat] = t.dataset.cfbud.split("|"); openModal({type:"cfbud", ym, cat, scope:"one"}); return true; }
  if(t.dataset.cfbudadd){ const C = cfSettings(), cm = thisMonth(); openModal({type:"cfbud", add:true, ym: C.from > cm ? C.from : (C.to < cm ? C.to : addMonths(cm,1) <= C.to ? addMonths(cm,1) : cm), cat:"travel", scope:"one"}); return true; }
  if(t.dataset.futtab){ S.futTab = t.dataset.futtab; try { localStorage.setItem("cashnest-futtab", S.futTab); } catch {} render(); return true; }
  if(t.dataset.cfp){ const cm = thisMonth(), y = cm.slice(0,4);
    const r = {p36:[addMonths(cm,-3), addMonths(cm,6)], n12:[cm, addMonths(cm,11)], yr:[`${y}-01`, `${y}-12`], l6:[addMonths(cm,-5), cm]}[t.dataset.cfp];
    saveSetting("cf", {...(S.settings.cf||{}), from:r[0], to:r[1]}); return true; }
  if(t.dataset.act==="cf-xlsx"){ cfExport(); return true; }
  return false;
}
function cfChange(el){
  if(el.id==="cf-from" || el.id==="cf-to"){
    const cf = {...(S.settings.cf||{}), ...cfSettings(), ...(S.settings.cf||{})};
    const C = cfSettings(); let from = el.id==="cf-from" ? el.value : C.from, to = el.id==="cf-to" ? el.value : C.to;
    if(from > to) [from, to] = el.id==="cf-from" ? [from, from] : [to, to];
    saveSetting("cf", {...(S.settings.cf||{}), from, to}); return true; }
  if(el.id==="cf-useexp"){ saveSetting("cf.useExpected", el.checked); return true; }
  if(el.dataset && el.dataset.repinc){ toggleRepayIncome(el.dataset.repinc, el.checked); return true; }
  if(el.id==="cf-usebud"){ saveSetting("cf.useBudget", el.checked); return true; }
  return false;
}

/* ---------- events ---------- */
root.addEventListener("click", async e => {
  const row = e.target.closest("tr[data-exp]");
  if(row){ const x = S.expenses.find(z=>z.id===row.dataset.exp); if(x && !S.readOnly) editExpenseModal(x); return; }
  const t = e.target.closest("button"); if(!t) return;
  if(personalClick(t)) return;
  const g = group();
  if(t.dataset.group) return selectGroup(t.dataset.group);
  if(t.dataset.stmt){ S.tab = "statements"; S.stmt.member = t.dataset.stmt; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.focus!=null){
    S.focus = (t.dataset.focus && S.focus!==t.dataset.focus) ? t.dataset.focus : null;
    render();
    if(S.focus) document.getElementById("breakdown")?.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  if(t.dataset.tab){ S.tab=t.dataset.tab; try{localStorage.setItem("fairshare-tab",S.tab);}catch{} return render(); }
  if(t.dataset.exp){ const x = S.expenses.find(z=>z.id===t.dataset.exp); if(x && !S.readOnly) editExpenseModal(x); return; }
  if(t.dataset.settle!=null && g){
    const p = simplify(computeBalances(g,S.expenses).bal)[+t.dataset.settle]; if(!p) return;
    return openModal({type:"settle", from:p.from, to:p.to, amount:fromCents(p.amount), date:todayISO(), notes:"", cur:g.currency});
  }
  switch(t.dataset.act){
    case "new-group": return openModal({type:"group", name:"", currency:"AED", members:[{id:uid(),name:"Me"}]});
    case "edit-group": return g && openModal({type:"group", id:g.id, name:g.name, currency:g.currency, members:g.members.map(p=>({...p}))});
    case "add-expense": return g && newExpenseModal();
    case "settle-custom": return g && openModal({type:"settle", from:g.members[0].id, to:g.members[1]?.id, amount:"", date:todayISO(), notes:""});
    case "show-unsplit": S.tab = "expenses"; S.catFilter = "unsplit"; return render();
    case "clear-filters": S.gf = {paid:"", who:"", period:"", from:"", to:"", split:""}; S.catFilter = ""; S.q = ""; return render();
    case "split-all": {
      if(!g) return;
      const list = S.expenses.filter(isUnsplit);
      if(t.dataset.armed !== "1"){ t.dataset.armed = "1"; t.textContent = `Split ${list.length} equally among all ${g.members.length}? Click to confirm`; return; }
      const w = {}; g.members.forEach(p=>w[p.id]=1);
      const inputs = {}; g.members.forEach(p=>inputs[p.id]=true);
      t.disabled = true;
      await write(async () => { for(const e of list){ const {needsSplit, ...rest} = e;
        await S.store.saveExpense(g.id, {...rest, splitType:"equal", inputs, splits:allocate(e.amount, w)}); } },
        `Split ${list.length} expense${list.length>1?"s":""} equally`);
      if(S.catFilter==="unsplit") S.catFilter = "";
      return render();
    }
    case "stmt-pdf": return g && downloadStatementPdf(g);
    case "add-credit": {
      if(!g) return;
      const mid = S.stmt.member || g.members[0].id;
      const other = (g.members.find(m=>m.id!==mid) || g.members[0]).id;
      return openModal({type:"settle", credit:true, from:mid, to:other, amount:"", date:todayISO(), notes:""});
    }
    case "export-excel": return g && exportExcel(g);
    case "import-excel": return g && !S.readOnly && openModal({type:"import-intro"});
    case "copy-summary":
      if(!g) return;
      try { await navigator.clipboard.writeText(summaryText(g)); toast("Summary copied, ready to paste into a chat"); }
      catch { toast("Couldn't copy. Your browser blocked clipboard access."); }
      return;
  }
});
root.addEventListener("input", e => {
  if(personalInput(e)) return;
  if(e.target.id==="search"){ S.q = e.target.value; const pos=e.target.selectionStart; render(); const s=document.getElementById("search"); s.focus(); s.setSelectionRange(pos,pos); }

  if(e.target.id==="st-member"){ S.stmt.member = e.target.value; render(); }

});
document.addEventListener("keydown", e => { if(e.key==="Escape" && S.modal) closeModal(); });

/* ---------- boot ---------- */
async function boot(){
  let db = null, userId = null;
  const cfg = window.CASHNEST_CONFIG;
  if(cfg && cfg.supabaseUrl && cfg.supabaseAnonKey && !/YOUR-/.test(cfg.supabaseUrl + cfg.supabaseAnonKey)){
    const r = await bootSupabase(cfg);
    if(!r) return;
    db = r.db; userId = r.userId; S.db = db;
  } else {
    S.cfgPending = !!cfg;
    try { if(window.claude && typeof window.claude.use === "function") db = await window.claude.use("db"); } catch {}
    if(db){ try { const u = await window.claude.use("user"); userId = u ? await u.id() : null; } catch {} }
  }
  S.store = db ? makeCloudStore(db) : makeLocalStore();
  S.pStore = (db && userId) ? makeCloudPersonal(db, userId) : makeLocalPersonal();
  S.pLocal = S.pStore.mode==="local";
  let saved = null; try { saved = localStorage.getItem("cashnest-module"); } catch {}
  S.module = modFromHash() || (MODULES.some(m=>m[0]===saved) ? saved : "my-nest");
  render();
  subscribeGroups();
  subscribePersonal();
  if(S.sb) processPendingJoin();
  refreshLiveRate();
}
boot();
})();

/* ---- phone number pads have no + − × ÷ ( ), so show a small maths bar under amount boxes on touch screens ---- */
(() => {
  const touch = () => matchMedia("(pointer: coarse)").matches;
  const ok = el => el && el.tagName==="INPUT" && el.getAttribute("inputmode")==="decimal" && !["rate-in","l-rate"].includes(el.id);
  let bar = null, target = null;
  const remove = () => { bar && bar.remove(); bar = null; target = null; };
  const insert = s => {
    const el = target; if(!el) return;
    const a = el.selectionStart ?? el.value.length, b = el.selectionEnd ?? a;
    if(s==="⌫"){ if(a===b && a>0){ el.value = el.value.slice(0,a-1) + el.value.slice(b); el.setSelectionRange(a-1,a-1); } else { el.value = el.value.slice(0,a) + el.value.slice(b); el.setSelectionRange(a,a); } }
    else { el.value = el.value.slice(0,a) + s + el.value.slice(b); el.setSelectionRange(a+s.length, a+s.length); }
    el.dispatchEvent(new Event("input", {bubbles:true}));
  };
  document.addEventListener("focusin", e => {
    if(!touch() || !ok(e.target)) return;
    if(target === e.target && bar) return;
    remove(); target = e.target;
    bar = document.createElement("div"); bar.className = "mathbar";
    bar.innerHTML = [["+","+"],["−","-"],["×","*"],["÷","/"],["(","("],[")",")"],["⌫","⌫"]].map(([l,v]) => `<button type="button" data-mk="${v}">${l}</button>`).join("");
    bar.addEventListener("pointerdown", ev => ev.preventDefault());            // keep the keyboard open
    bar.addEventListener("mousedown", ev => ev.preventDefault());
    bar.addEventListener("click", ev => { const b = ev.target.closest("[data-mk]"); if(b){ ev.preventDefault(); ev.stopPropagation(); insert(b.dataset.mk); } });
    target.insertAdjacentElement("afterend", bar);
  });
  document.addEventListener("focusout", e => { if(e.target === target) setTimeout(() => { if(document.activeElement !== target) remove(); }, 150); });
})();
