<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CashNest</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0f766e">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CashNest">
<script>if("serviceWorker" in navigator && location.protocol==="https:") addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(()=>{}));</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --panel:#ffffff; --panel2:#faf9f6; --ink:#1d1d1b; --muted:#6f6c66; --line:#e6e2d9;
  --accent:#0f766e; --accent-ink:#ffffff; --accent-soft:#e0f2ef;
  --pos:#15803d; --pos-soft:#e6f4ea; --neg:#c2410c; --neg-soft:#fdeee5;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.05);
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#141413;--panel:#1d1d1b;--panel2:#232320;--ink:#f0eee8;--muted:#a19d94;--line:#34332f;
  --accent:#2dd4bf;--accent-ink:#0b1f1d;--accent-soft:#163632;--pos:#4ade80;--pos-soft:#15301f;--neg:#fb923c;--neg-soft:#3a2416;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25)}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;font-size:15px;line-height:1.45}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:20px 14px;background:var(--panel2);display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px 6px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-family:"Bricolage Grotesque"}
.brand h1{font-size:21px}
.side-label{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:0 8px}
.glist{display:flex;flex-direction:column;gap:4px}
.gitem{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;border:0;background:transparent;text-align:left;width:100%}
.gitem:hover{background:var(--line)}
.gitem.active{background:var(--accent-soft);font-weight:600}
.gitem .dot{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.gitem .meta{font-size:12px;color:var(--muted);font-weight:400}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 14px;border-radius:10px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--line)}
.btn.danger{color:var(--neg)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.5;cursor:not-allowed}
main{padding:28px 32px 100px;max-width:1000px;width:100%}
.notice{font-size:13px;padding:9px 12px;border-radius:10px;background:var(--panel);border:1px dashed var(--line);color:var(--muted);margin-bottom:16px}
.ghead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ghead h2{font-size:30px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 3px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-family:"Bricolage Grotesque";font-size:24px;font-weight:700;margin-top:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{border:0;background:none;padding:10px 14px;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--ink);border-bottom-color:var(--accent)}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.input,select.input,textarea.input{border:1px solid var(--line);background:var(--panel);padding:9px 12px;border-radius:10px;width:100%;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--neg-soft);color:var(--neg);vertical-align:middle;margin-left:4px}
.erow.unsplit{background:color-mix(in srgb, var(--neg-soft) 40%, transparent)}
table.tpl{min-width:0;font-size:12.5px}
table.tpl th,table.tpl td{padding:8px 9px;text-align:left}
table.tpl td:nth-child(5),table.tpl th:nth-child(5){text-align:right}
.stmt-bar{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-bottom:16px}
.stmt-bar .field{min-width:150px}
.stmt-head{margin:6px 0 14px}
.stmt-head .k{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stmt-head .s{color:var(--muted);font-size:14px}
.stmt-sum{max-width:440px;margin-left:auto;padding:14px 18px}
.warn-banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--neg-soft);border:1px solid color-mix(in srgb, var(--neg) 30%, transparent);font-size:14px;margin-bottom:14px}
.month{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:18px 4px 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.erow{display:grid;grid-template-columns:46px 40px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.erow:last-child{border-bottom:0}
.erow:hover{background:var(--panel2)}
.date{text-align:center;line-height:1.1;color:var(--muted);font-size:11px;text-transform:uppercase}
.date b{display:block;font-size:19px;color:var(--ink);font-family:"Bricolage Grotesque"}
.cat{width:40px;height:40px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:19px}
.erow .t{font-weight:600}
.erow .s{font-size:13px;color:var(--muted)}
.amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.amt .s{font-weight:400}
.settle-row .t{font-weight:500}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty .big{font-size:42px;margin-bottom:8px}
.empty h3{color:var(--ink);font-size:20px;margin-bottom:6px}
.bal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-bottom:24px}
.bal{padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
button.bal{text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer;transition:border-color .15s,box-shadow .15s}
button.bal:hover{border-color:var(--muted)}
button.bal.on{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tbl-wrap{overflow-x:auto}
table.bk{min-width:600px}
table.bk th,table.bk td{white-space:nowrap}
table.bk td:nth-child(2),table.bk th:nth-child(2),table.bk td:nth-child(3),table.bk th:nth-child(3){text-align:left}
table.bk tbody tr{cursor:pointer}
table.bk tbody tr:hover{background:var(--panel2)}
table.bk .muted{color:var(--muted)}
table.bk .hl{background:var(--accent-soft);font-weight:600}
table.bk tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0;background:var(--panel2)}
table.bk tfoot td.hl{background:var(--accent-soft)}
.focus-card{padding:14px 16px;margin-bottom:12px}
.dl{display:flex;justify-content:space-between;padding:5px 0;font-size:14px;font-variant-numeric:tabular-nums}
.dl.total{border-top:1px solid var(--line);margin-top:6px;padding-top:9px;font-size:15px}
.bal .who{display:flex;align-items:center;gap:8px;font-weight:600}
.bal .num{font-family:"Bricolage Grotesque";font-size:22px;font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums}
.bal .lbl{font-size:13px;color:var(--muted)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:3px}
h3.sec{font-size:18px;margin:6px 0 12px}
.srow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .arrow{color:var(--muted)}
.srow .grow{flex:1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.catbar{display:grid;grid-template-columns:150px 1fr 110px;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.catbar:last-child{border-bottom:0}
.catbar .track{height:10px;background:var(--panel2);border-radius:5px;overflow:hidden;border:1px solid var(--line)}
.catbar .track i{display:block;height:100%;background:var(--accent);border-radius:5px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 16px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:500}
tr:last-child td{border-bottom:0}
.fab{position:fixed;z-index:40;right:28px;bottom:28px;box-shadow:0 8px 24px rgba(15,118,110,.35);padding:14px 20px;border-radius:999px;font-size:15px}
.overlay{position:fixed;inset:0;background:rgba(20,20,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:var(--panel);border-radius:18px;width:100%;max-width:520px;box-shadow:0 20px 60px rgba(0,0,0,.25);border:1px solid var(--line)}
.modal header{padding:18px 20px 6px;display:flex;justify-content:space-between;align-items:center}
.modal header h3{font-size:20px}
.modal .body{padding:10px 20px 4px;display:flex;flex-direction:column;gap:14px}
.modal footer{padding:16px 20px 18px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.field label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.amount-in{font-family:"Bricolage Grotesque";font-size:26px;font-weight:700;padding:8px 12px}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.splits{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sp{display:grid;grid-template-columns:24px 1fr 160px;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line)}
.sp:last-child{border-bottom:0}
.sp input[type=number]{padding:6px 8px;text-align:right}
.sp .share{font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.sp input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
.split-status{font-size:13px;padding:8px 12px;background:var(--panel2);display:flex;justify-content:space-between}
.err{color:var(--neg);font-size:13px;min-height:18px}
.calc{font-size:12px;color:var(--accent);font-weight:500;margin-top:3px;min-height:16px;font-variant-numeric:tabular-nums}
.calc .bad{color:var(--neg)}
.hint{font-size:12px;color:var(--muted);padding:6px 12px 0}
.mem-list{display:flex;flex-direction:column;gap:6px}
.mem{display:flex;gap:8px;align-items:center}
.cat-pick{display:flex;flex-wrap:wrap;gap:6px}
.cat-pick button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 10px;font-size:13px}
.cat-pick button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:80;box-shadow:var(--shadow)}
.mobile-top{display:none}
.loading{padding:60px;text-align:center;color:var(--muted)}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  .mobile-top{display:flex;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:10}
  .mobile-top select{flex:1}
  main{padding:18px 16px 110px}
  .ghead h2{font-size:24px}
  .stats{grid-template-columns:1fr 1fr}
  .stats .stat:last-child{grid-column:span 2}
  .erow{grid-template-columns:38px 1fr auto;gap:10px;padding:11px 12px}
  .erow .cat{display:none}
  .catbar{grid-template-columns:100px 1fr 80px;padding:10px 12px}
  th,td{padding:9px 10px}
  .fab{right:16px;bottom:16px}
  main{min-width:0;max-width:100vw;overflow-x:hidden}
  .app{grid-template-columns:minmax(0,1fr)}
  .tabs{flex-wrap:nowrap}.tabs .tab{flex:0 0 auto}
  .ptable-wrap{overflow-x:auto}
  .ptable .pcol{display:none}
  .ptable td,.ptable th{padding:9px 8px}
}

/* ---------- CashNest ---------- */
:root{--s1:#2a78d6;--s2:#eb6834;--warn:#b45309;--warn-soft:#fdf3e1}
@media (prefers-color-scheme:dark){:root{--s1:#3987e5;--s2:#d95926;--warn:#f59e0b;--warn-soft:#3a2d12}}
.brand .logo svg{display:block}
.mods{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:10px;text-align:left;font-weight:500;color:var(--ink);width:100%}
.nav:hover{background:var(--line)}
.nav.on{background:var(--accent-soft);font-weight:700}
.nav .ni{width:24px;text-align:center;font-size:16px}
.glist.sub{margin:2px 0 6px 18px;padding-left:8px;border-left:2px solid var(--line)}
.glist.sub .gitem{padding:6px 8px}
.glist.sub .gitem .dot{width:24px;height:24px;font-size:11px}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}
.mhead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.mhead h2{font-size:28px}
.mhead .sub{color:var(--muted);margin-top:2px}
.hbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mnav{display:flex;align-items:center;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:2px}
.mnav b{min-width:120px;text-align:center;font-size:14px}
.mnav .btn{font-size:18px;line-height:1;padding:4px 10px}
.stats.four{grid-template-columns:repeat(4,1fr)}
.stat .note{font-size:12.5px;color:var(--muted);margin-top:3px}
.stat .v.pos,.v.pos{color:var(--pos)} .stat .v.neg{color:var(--neg)}
.stat .money-in{margin-top:6px;font-family:"Bricolage Grotesque";font-size:20px;font-weight:700;padding:6px 10px}
.prow{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:11px 16px;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left;cursor:pointer}
.prow:last-child{border-bottom:0}
.prow:hover{background:var(--panel2)}
.prow .t{font-weight:600}
.prow .s,.s{font-size:13px;color:var(--muted)}
.cat.sm{width:32px;height:32px;font-size:16px;border-radius:9px;flex:none}
.dayh{display:flex;justify-content:space-between;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600}
.pbar{height:8px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);overflow:hidden}
.pbar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.pbar.ok>i{background:var(--pos)} .pbar.warn>i{background:#e5a50a} .pbar.over>i{background:var(--neg)}
.st{font-size:12.5px;font-weight:600;white-space:nowrap}
.st.ok{color:var(--pos)} .st.warn{color:var(--warn)} .st.over{color:var(--neg)}
.overall{padding:14px 16px;margin-bottom:6px}
.overall .dl{margin-bottom:6px}
.brow{display:grid;grid-template-columns:minmax(170px,1.1fr) 1.4fr 150px;gap:16px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.bname{display:flex;gap:10px;align-items:center}
.bbar{display:flex;flex-direction:column;gap:5px}
.blim{display:flex;flex-direction:column;gap:3px}
.blim .input{padding:7px 10px;text-align:right}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.goal{padding:16px;display:flex;flex-direction:column;gap:9px}
.ghd{display:flex;gap:10px;align-items:center}
.gemoji{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:22px;flex:none}
.gnum{display:flex;align-items:baseline;gap:4px}
.gnum b{font-family:"Bricolage Grotesque";font-size:22px}
.gp{margin-left:auto;font-weight:700;color:var(--accent)}
.goal .btn{align-self:flex-start}
.hist{padding:6px 12px;max-height:180px;overflow:auto;box-shadow:none}
.calc-card{display:grid;grid-template-columns:280px 1fr;gap:20px;padding:18px}
.calc-in{display:flex;flex-direction:column;gap:12px}
.calc-out{min-width:0}
.calc-out .stats{grid-template-columns:repeat(3,1fr)}
.calc-out .stat{box-shadow:none;padding:10px 12px}
.calc-out .stat .v{font-size:19px}
.sfx{display:flex;align-items:center;gap:6px}
.sfx span{font-size:13px;color:var(--muted);min-width:24px}
.chart svg{display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .base{stroke:var(--muted);stroke-width:1;opacity:.6}
.chart .refl{stroke:var(--neg);stroke-width:1.5;stroke-dasharray:5 4}
.chart .ax{font-size:11px;fill:var(--muted);font-family:"DM Sans",system-ui,sans-serif}
.chart .axb{fill:var(--ink);font-weight:600}
.chart .hit{cursor:crosshair}
.chart .hit:hover{fill:var(--ink);fill-opacity:.05}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:0 0 6px 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;z-index:90;display:none;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-width:260px}
.tip i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.tip b:first-child{display:block;margin-bottom:2px}
.ins-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:22px}
.ins-grid .catbar{grid-template-columns:140px 1fr 110px}
.nest-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.nest-card{padding:6px 0 0}
.nc-h{display:flex;justify-content:space-between;align-items:center;padding:8px 16px 6px}

<script src="config.js"></script>
<div id="root"><div class="loading">Loading your expenses…</div></div>

<script>
(() => {
"use strict";

/* ---------- helpers ---------- */
const CATEGORIES = [
  ["food","🍽️","Food & drink"],["groceries","🛒","Groceries"],["transport","🚕","Transport"],
  ["rent","🏠","Rent"],["utilities","💡","Utilities"],["entertainment","🎬","Entertainment"],
  ["travel","✈️","Travel"],["shopping","🛍️","Shopping"],["health","💊","Health"],["loans","🏦","Loan payments"],
  ["education","📚","Education"],["personal","💅","Personal care"],["family","👨‍👩‍👧","Family"],["other","📦","Other"]
];
const CAT = Object.fromEntries(CATEGORIES.map(([k,i,l])=>[k,{icon:i,label:l}]));
/* ---- custom categories: your own, plus renamed built-ins (kept in your personal settings) ---- */
const BASE_CATS = CATEGORIES.map(c => [...c]);
const FOREIGN_CATS = {};        // custom categories other group members used on shared expenses
let _catsSig = "";
function applyCats(force){
  const st = (typeof S!=="undefined" && S.settings && S.settings.cats) || {}, sig = JSON.stringify(st) + Object.keys(FOREIGN_CATS).join();
  if(!force && sig === _catsSig) return; _catsSig = sig;
  const edit = st.edit || {}, custom = (st.custom || []).filter(c => c && c.k && c.label);
  const base = BASE_CATS.map(([k,i,l]) => [k, (edit[k]&&edit[k].icon) || i, (edit[k]&&edit[k].label) || l]);
  const list = [...base.filter(c=>c[0]!=="other"), ...custom.map(c => [c.k, c.icon||"🏷️", c.label]), base.find(c=>c[0]==="other")];
  CATEGORIES.splice(0, CATEGORIES.length, ...list);
  Object.keys(CAT).forEach(k => delete CAT[k]);
  Object.entries(FOREIGN_CATS).forEach(([k,v]) => CAT[k] = v);
  list.forEach(([k,i,l]) => CAT[k] = {icon:i, label:l});
}
const isBaseCat = k => BASE_CATS.some(c => c[0]===k);
const catTag = k => (!k || isBaseCat(k) || !CAT[k]) ? {} : {catLabel:CAT[k].label, catIcon:CAT[k].icon};
function noteForeignCats(list){
  let changed = false;
  (list||[]).forEach(e => { if(e && e.catLabel && e.category && !isBaseCat(e.category) && !FOREIGN_CATS[e.category]){ FOREIGN_CATS[e.category] = {icon:e.catIcon||"🏷️", label:e.catLabel}; changed = true; } });
  if(changed) applyCats(true);
}
const CURRENCIES = ["AED","USD","EUR","GBP","INR","PHP","SAR","QAR","KWD","OMR","BHD","PKR","EGP","CAD","AUD","SGD","JPY","CNY"];
const PALETTE = ["#0f766e","#b45309","#7c3aed","#be123c","#1d4ed8","#4d7c0f","#c2410c","#0e7490","#a21caf","#475569"];

const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
/* Safe calculator for inputs like "(800-50)/3 + 50". Returns NaN if it can't be read. */
function calc(src){
  const s = String(src ?? "").replace(/,/g,"").replace(/[×xX]/g,"*").replace(/÷/g,"/").trim();
  if(!s) return 0;
  let i = 0;
  const sp = () => { while(s[i]===" ") i++; };
  const expr = () => { let v = term(); for(;;){ sp(); if(s[i]==="+"){ i++; v += term(); } else if(s[i]==="-"){ i++; v -= term(); } else return v; } };
  const term = () => { let v = factor(); for(;;){ sp(); if(s[i]==="*"){ i++; v *= factor(); } else if(s[i]==="/"){ i++; v /= factor(); } else return v; } };
  const factor = () => {
    sp();
    if(s[i]==="-"){ i++; return -factor(); }
    if(s[i]==="+"){ i++; return factor(); }
    if(s[i]==="("){ i++; const v = expr(); sp(); if(s[i]!==")") throw 0; i++; return v; }
    const m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i)); if(!m) throw 0;
    i += m[0].length; return parseFloat(m[0]);
  };
  try { const v = expr(); sp(); return (i===s.length && isFinite(v)) ? v : NaN; } catch { return NaN; }
}
const isFormula = v => /[+\-*/()×÷xX]/.test(String(v ?? "").trim().replace(/^-/,""));
const toCents = v => { const n = calc(v); return isFinite(n) ? Math.round(n*100) : NaN; };
const fromCents = c => (c/100).toFixed(2);
function moneyFull(cents, cur){
  try { return new Intl.NumberFormat(undefined,{style:"currency",currency:cur||"AED"}).format(cents/100); }
  catch { return (cur||"") + " " + (cents/100).toFixed(2); }
}
/* ---- display currency (AED ⇄ PHP) ---- */
const FX = { view:null, rate:16.70, src:"default", at:0 };
try { const v = localStorage.getItem("cashnest-viewcur"); if(v) FX.view = v;
      const r = JSON.parse(localStorage.getItem("cashnest-rate")||"null"); if(r && r.rate>0) Object.assign(FX, {rate:r.rate, src:r.src||"you", at:r.at||0}); } catch {}
function conv(cents, from){
  const to = FX.view;
  if(!to || !from || from===to) return {c:cents, cur:from};
  if(from==="AED" && to==="PHP") return {c:Math.round(cents*FX.rate), cur:"PHP"};
  if(from==="PHP" && to==="AED") return {c:Math.round(cents/FX.rate), cur:"AED"};
  return {c:cents, cur:from};
}
function money(cents, cur){
  if(S.modal && !S._pageRender) return moneyFull(cents, cur);
  const x = conv(cents, cur||"AED");
  const n = (x.c/100).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2});
  return x.cur === headerCur() ? n : `${x.cur} ${n}`;
}
/* ---- entry currency: type an amount in AED or PHP; it's saved in the group's / your currency ---- */
const PAIR = ["AED","PHP"];
const canPickCur = base => PAIR.includes(base);
function toBase(c, from, base){
  if(!from || from===base) return c;
  if(from==="PHP" && base==="AED") return Math.round(c / FX.rate);
  if(from==="AED" && base==="PHP") return Math.round(c * FX.rate);
  return c;
}
const entryCur = (m, base) => m.cur || (canPickCur(base) ? "AED" : base);
const curPick = (m, base, attr) => canPickCur(base)
  ? `<span class="curpick">${PAIR.map(c=>`<button type="button" data-${attr}="${c}" class="${entryCur(m,base)===c?"on":""}">${c}</button>`).join("")}</span>`
  : `<span>(${esc(base)})</span>`;
function convNote(m, base, amountStr){
  const cur = entryCur(m, base); if(cur===base) return "";
  const c = toCents(amountStr ?? m.amount);
  const rate = `1 AED = ${FX.rate} PHP`;
  return (isFinite(c) && c>0) ? `≈ ${moneyFull(toBase(c,cur,base), base)} · ${rate}` : `Saved in ${base} at ${rate}`;
}
const origTag = (m, base, entryCents) => { const cur = entryCur(m, base); return cur===base ? {} : {origAmount:entryCents, origCurrency:cur, fxRate:FX.rate}; };
const enteredAs = x => x && x.origCurrency && x.origAmount ? ` · entered ${moneyFull(x.origAmount, x.origCurrency)}` : "";

/* Split an integer amount of cents by weights, distributing leftover cents fairly. */
function allocate(total, weights){
  const ids = Object.keys(weights).filter(k=>weights[k]>0);
  const sum = ids.reduce((a,k)=>a+weights[k],0);
  const out = {}; if(!sum) return out;
  let used = 0;
  const rem = ids.map(k=>{ const exact = total*weights[k]/sum; const f=Math.floor(exact); out[k]=f; used+=f; return [k, exact-f]; });
  rem.sort((a,b)=>b[1]-a[1]);
  for(let i=0;i<total-used;i++) out[rem[i % rem.length][0]]++;
  return out;
}

/* ---------- storage: cloud db, or this browser as a fallback ---------- */
function makeCloudStore(db){
  const snapList = (s) => s.docs.map(d => ({...d.data(), id:d.id}));
  return {
    mode:"cloud",
    subGroups(cb, err){ return db.collection("groups").onSnapshot(s=>cb(snapList(s), s.metadata), err); },
    subExpenses(gid, cb, err){ return db.collection(`groups/${gid}/expenses`).onSnapshot(s=>cb(snapList(s), s.metadata), err); },
    saveGroup(g){ const {id,...rest}=g; return db.doc(`groups/${id}`).set(rest); },
    async deleteGroup(id){
      const snap = await db.collection(`groups/${id}/expenses`).get();
      for(const d of snap.docs) await db.doc(`groups/${id}/expenses/${d.id}`).delete();
      await db.doc(`groups/${id}`).delete();
    },
    saveExpense(gid, e){ const {id,...rest}=e; return db.doc(`groups/${gid}/expenses/${id}`).set(rest); },
    deleteExpense(gid, id){ return db.doc(`groups/${gid}/expenses/${id}`).delete(); },
    async getExpenses(gid){ const s = await db.collection(`groups/${gid}/expenses`).get(); return snapList(s).filter(e=>e && typeof e.amount==="number"); }
  };
}
function makeLocalStore(){
  const KEY = "fairshare-local-v1";
  let data = null;
  try { data = JSON.parse(localStorage.getItem(KEY) || "null"); } catch {}
  data = data || {groups:{}, expenses:{}};
  const gl = new Set(), el = new Map();
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };
  const meta = {fromCache:false, hasPendingWrites:false};
  const emitG = () => gl.forEach(f => f(Object.values(data.groups), meta));
  const emitE = gid => (el.get(gid)||new Set()).forEach(f => f(Object.values(data.expenses[gid]||{}), meta));
  return {
    mode:"local",
    subGroups(cb){ gl.add(cb); setTimeout(()=>cb(Object.values(data.groups), meta)); return ()=>gl.delete(cb); },
    subExpenses(gid, cb){ if(!el.has(gid)) el.set(gid,new Set()); el.get(gid).add(cb); setTimeout(()=>cb(Object.values(data.expenses[gid]||{}), meta)); return ()=>el.get(gid).delete(cb); },
    async saveGroup(g){ data.groups[g.id] = g; persist(); emitG(); },
    async deleteGroup(id){ delete data.groups[id]; delete data.expenses[id]; persist(); emitG(); emitE(id); },
    async saveExpense(gid, e){ (data.expenses[gid] ||= {})[e.id] = e; persist(); emitE(gid); },
    async deleteExpense(gid, id){ if(data.expenses[gid]) delete data.expenses[gid][id]; persist(); emitE(gid); },
    async getExpenses(gid){ return Object.values(data.expenses[gid]||{}); }
  };
}

/* ---------- calculations ---------- */
const isUnsplit = e => e.kind!=="settle" && (e.needsSplit || !Object.keys(e.splits||{}).length);
function computeBalances(g, expenses){
  const bal = {}, paid = {}, share = {};
  g.members.forEach(m => { bal[m.id]=0; paid[m.id]=0; share[m.id]=0; });
  for(const e of expenses){
    if(e.kind === "settle"){
      bal[e.from] = (bal[e.from]||0) + e.amount;
      bal[e.to] = (bal[e.to]||0) - e.amount;
    } else {
      if(isUnsplit(e)) continue;
      bal[e.paidBy] = (bal[e.paidBy]||0) + e.amount;
      paid[e.paidBy] = (paid[e.paidBy]||0) + e.amount;
      for(const [mid,c] of Object.entries(e.splits||{})){ bal[mid]=(bal[mid]||0)-c; share[mid]=(share[mid]||0)+c; }
    }
  }
  return {bal, paid, share};
}
function simplify(bal){
  const cred = [], debt = [];
  for(const [id,v] of Object.entries(bal)){ if(v>0) cred.push([id,v]); else if(v<0) debt.push([id,-v]); }
  cred.sort((a,b)=>b[1]-a[1]); debt.sort((a,b)=>b[1]-a[1]);
  const out = []; let i=0,j=0;
  while(i<debt.length && j<cred.length){
    const x = Math.min(debt[i][1], cred[j][1]);
    if(x>0) out.push({from:debt[i][0], to:cred[j][0], amount:x});
    debt[i][1]-=x; cred[j][1]-=x;
    if(debt[i][1]===0) i++; if(cred[j][1]===0) j++;
  }
  return out;
}

async function write(fn, okMsg){
  if(S.readOnly){ toast("You have view-only access to this page."); return false; }
  try { await fn(); if(okMsg) toast(okMsg); return true; }
  catch(e){
    const code = e && e.code;
    if(code === "invalid_argument" || code === "not_granted"){ S.readOnly = true; toast("You have view-only access, so changes can't be saved."); render(); }
    else if(code === "quota_exceeded") toast("Storage is full. Delete some old expenses or groups and try again.");
    else toast("Couldn't save. Please try again.");
    return false;
  }
}

}

  `;
}

function unsplitBanner(){
  const n = S.expenses.filter(isUnsplit).length;
  if(!n) return "";
  return `<div class="warn-banner"><span>⚠️ <b>${n} expense${n>1?"s":""} not split yet.</b> ${n>1?"They aren't":"It isn't"} counted in balances or statements until you split ${n>1?"them":"it"}.</span>
    <span style="display:flex;gap:6px;flex-wrap:wrap">
      ${S.catFilter!=="unsplit" ? `<button class="btn sm" data-act="show-unsplit">Show ${n>1?"them":"it"}</button>` : ""}

function expenseRow(g, e){
  const d = new Date((e.date||todayISO())+"T00:00:00");
  const picked = S.sel.on && S.sel.ids.has(e.id), pk = picked ? " picked" : "";
  const dateHtml = S.sel.on ? `<div class="date">${selBox(picked)}</div>` : `<div class="date">${d.toLocaleDateString(undefined,{month:"short"})}<b>${d.getDate()}</b></div>`;
  if(e.kind === "settle"){
    return `<button class="erow settle-row${pk}" data-exp="${esc(e.id)}">${dateHtml}<div class="cat">🤝</div>
      <div><div class="t">${esc(memberName(g,e.from))} paid ${esc(memberName(g,e.to))}</div><div class="s">Payment${e.notes?" · "+esc(e.notes):""}${enteredAs(e)}</div></div>
      <div class="amt pos">${money(e.amount,g.currency)}</div></button>`;
  }
  const c = CAT[e.category] || CAT.other;
  if(isUnsplit(e)) return `<button class="erow unsplit${pk}" data-exp="${esc(e.id)}">${dateHtml}<div class="cat">${c.icon}</div>
    <div><div class="t">${esc(e.desc)} <span class="badge">Needs splitting</span></div><div class="s">${esc(memberName(g,e.paidBy))} paid · click to choose who shares it${enteredAs(e)}</div></div>
    <div class="amt">${money(e.amount,g.currency)}<div class="s">${c.label}</div></div></button>`;

  return `<button class="erow${pk}" data-exp="${esc(e.id)}">${dateHtml}<div class="cat">${c.icon}</div>
    <div><div class="t">${esc(e.desc)}</div><div class="s">${esc(memberName(g,e.paidBy))} paid · ${n} ${n===1?"person":"people"}, ${method}${enteredAs(e)}</div></div>
    <div class="amt">${money(e.amount,g.currency)}<div class="s">${c.label}</div></div></button>`;
}

function renderBreakdown(g, bal, paid, share){

    .sort((a,b)=> (b.date||"").localeCompare(a.date||"") || (b.createdAt||0)-(a.createdAt||0));
  const cur = g.currency;
  const fmtD = d => new Date((d||todayISO())+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
  let detail = "";
  if(fm){
    const sent = S.expenses.filter(e=>e.kind==="settle"&&e.from===fm.id).reduce((a,e)=>a+e.amount,0);
    const recv = S.expenses.filter(e=>e.kind==="settle"&&e.to===fm.id).reduce((a,e)=>a+e.amount,0);
    const v = bal[fm.id]||0;
    const line = (k,val,cls="") => `<div class="dl"><span>${k}</span><b class="${cls}">${val}</b></div>`;
    detail = `<div class="card focus-card">
      <div class="who" style="display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:8px">${av(fm,g.members)}How ${esc(fm.name)}'s balance adds up
        <span style="margin-left:auto;display:flex;gap:6px"><button class="btn sm" data-stmt="${esc(fm.id)}">📄 Statement & PDF</button>
        <button class="btn sm ghost" data-focus="">Show everyone</button></span></div>
      ${line("Paid for the group", money(paid[fm.id]||0,cur), "pos")}
      ${line("Their share of expenses", "− "+money(share[fm.id]||0,cur), "neg")}
      ${sent?line("Payments they made", "+ "+money(sent,cur), "pos"):""}
      ${recv?line("Payments they received", "− "+money(recv,cur), "neg"):""}
      <div class="dl total"><span>${v>0?"Gets back":v<0?"Owes":"Settled up"}</span><b class="${v>0?"pos":v<0?"neg":""}">${money(Math.abs(v),cur)}</b></div>

function renderBalances(g){

  if(S.focus && !g.members.some(m=>m.id===S.focus)) S.focus = null;
  return `
    ${unsplitBanner()}
    <div class="bal-grid">
      ${g.members.map(m => { const v = bal[m.id]||0; return `

function renderInsights(g){
  const {paid, share} = computeBalances(g, S.expenses);
  const real = S.expenses.filter(e=>e.kind!=="settle");
  if(!real.length) return `<div class="card empty"><div class="big">📊</div><p>Add a few expenses to see where the money goes.</p></div>`;
  const byCat = {};
  real.forEach(e => byCat[e.category||"other"] = (byCat[e.category||"other"]||0) + e.amount);

        <div style="text-align:right;font-variant-numeric:tabular-nums"><b>${money(v,g.currency)}</b> <span style="color:var(--muted);font-size:12px">${Math.round(v/total*100)}%</span></div>

function renderModal(){
  applyCats();
  document.querySelector(".overlay")?.remove();
  const m = S.modal; if(!m) return;
  const ov = document.createElement("div"); ov.className = "overlay";
  const ext = EXTRA_MODALS[m.type];
  ov.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${ext ? ext[0](m) : 
    m.type==="group" ? groupModal(m) : m.type==="expense" ? expenseModal(m) : m.type==="import" ? importModal(m) : m.type==="import-intro" ? importIntroModal() : settleModal(m)}</div>`;

/* which expenses mention each person (id → list of labels) */
function memberUsage(){
  const use = new Map(), g = group();
  if(!S.modal || !S.modal.id || !g) return use;
  const add = (id, label) => { if(!id) return; if(!use.has(id)) use.set(id, []); use.get(id).push(label); };
  S.expenses.forEach(e => {
    if(e.kind==="settle"){ const l = `payment ${memberName(g,e.from)} → ${memberName(g,e.to)} (${fmtDay(e.date)})`; add(e.from, l); add(e.to, l); return; }
    const l = `“${e.desc}”${isUnsplit(e) ? " (not split yet)" : ""}`;
    add(e.paidBy, l + " as the payer");
    Object.entries(e.splits||{}).forEach(([id,c]) => { if(c>0) add(id, l); });
  });
  return use;
}

function calcPreview(v, g){
  const c = toCents(v);
  if(String(v ?? "").trim() && !isFinite(c)) return `<span class="bad">Can't read this sum</span>`;
  if(!isFormula(v)) return "";
  return isFinite(c) ? `= ${moneyFull(c, g.currency)}` : `<span class="bad">Can't read this sum</span>`;
}
function computeSplit(m, g){
  const total = toCents(m.amount) || 0;
  const ids = g.members.map(p=>p.id);
  if(m.splitType==="equal"){
    const w = {}; ids.forEach(id => { if(m.inputs[id]) w[id]=1; });
    const n = Object.keys(w).length;
    return {splits: allocate(total, w), ok: n>0 && total>0, msg: n? "" : "Pick at least one person."};
  }
  if(m.splitType==="exact"){
    const s = {}; let sum=0, bad=false;
    ids.forEach(id => { const c = toCents(m.inputs[id]); if(!isFinite(c)){ bad=true; return; } if(c>0){ s[id]=c; sum+=c; } });
    return {splits:s, ok: !bad && total>0 && sum===total, sum, left: total-sum, bad};
  }
  if(m.splitType==="percent"){
    const w = {}; let pct=0; ids.forEach(id => { const p = parseFloat(m.inputs[id])||0; if(p>0){ w[id]=p; pct+=p; } });
    return {splits: allocate(total, w), ok: total>0 && Math.abs(pct-100)<0.001, pct};
  }
  const w = {}; let sh=0; ids.forEach(id => { const p = parseFloat(m.inputs[id])||0; if(p>0){ w[id]=p; sh+=p; } });
  return {splits: allocate(total, w), ok: total>0 && sh>0, sh};
}
function splitStatus(comp, total, g, m){
  if(m.splitType==="equal"){
    const n = Object.keys(comp.splits).length;
    return `<span>${n} ${n===1?"person":"people"}</span><span>${n&&total?money(Math.floor(total/n),entryCur(m, g.currency))+" each":""}</span>`;
  }
  if(m.splitType==="exact"){
    const left = comp.left ?? total;
    return `<span>${money(comp.sum||0,entryCur(m, g.currency))} of ${money(total,entryCur(m, g.currency))}</span><span class="${left===0?"pos":"neg"}">${left===0?"✓ Adds up":money(Math.abs(left),entryCur(m, g.currency))+(left>0?" left":" over")}</span>`;
  }
  if(m.splitType==="percent"){
    const p = Math.round((comp.pct||0)*100)/100;
    return `<span>${p}% of 100%</span><span class="${comp.ok?"pos":"neg"}">${comp.ok?"✓ Adds up":(100-p>0?(Math.round((100-p)*100)/100)+"% left":(Math.round((p-100)*100)/100)+"% over")}</span>`;
  }
  return `<span>${comp.sh||0} shares in total</span><span></span>`;
}

    </div>
    <div class="row2">
      <div class="field"><label class="amt-lbl">Amount ${curPick(m, g.currency, "scur")}</label><input class="input amount-in" id="s-amt" type="text" inputmode="decimal" autocomplete="off" value="${esc(m.amount)}"><div class="calc" id="s-calc">${calcPreview(m.amount, {currency:ec})}</div><div class="s conv" id="s-conv">${convNote(m, g.currency)}</div></div>
      <div class="field"><label>Date</label><input class="input" id="s-date" type="date" value="${esc(m.date)}" style="padding:13px 12px"></div>
    </div>
    <div class="field"><label>Details${m.credit?"":" (optional)"}</label><input class="input" id="s-notes" value="${esc(m.notes)}" placeholder="${m.credit?"e.g. Cash for October rent":"e.g. Bank transfer"}"></div>
    <div class="err" id="s-err"></div>
  </div>
  <footer>
    ${m.id?`<button class="btn danger ghost" data-delexp>Delete</button>`:"<span></span>"}
    <div style="display:flex;gap:8px"><button class="btn" data-close>Cancel</button><button class="btn primary" data-savesettle>Save payment</button></div>
  </footer>`;
}

function bindModal(ov){
  const m = S.modal, g = group();
  const $ = s => ov.querySelector(s);
  ov.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModal);
  if(EXTRA_MODALS[m.type]){ EXTRA_MODALS[m.type][1](ov, m); return; }
  if(m.type==="import"){
    const b = $("[data-doimport]"); if(b) b.onclick = () => runImport(b);
    const replan = () => { m.plan = planImport(m.sheets, g, m.opts); renderModal(); };
    ov.querySelectorAll("[data-opt-unsplit]").forEach(x => x.onclick = () => { m.opts.unsplit = x.dataset.optUnsplit; replan(); });
    const ps = $("#i-payer"); if(ps) ps.onchange = () => { m.opts.defaultPayer = ps.value; replan(); };
    return;
  }
  if(m.type==="import-intro"){
    $("[data-tpl]").onclick = () => downloadTemplate(g);
    $("[data-pick]").onclick = () => { closeModal(); pickImportFile(); };
    return;
  }

  if(m.type==="group"){
    const sync = () => {
      m.name = $("#g-name").value; m.currency = $("#g-cur").value;
      ov.querySelectorAll("[data-mem]").forEach(inp => m.members[+inp.dataset.mem].name = inp.value);
    };
    const addMem = () => { sync(); const v = $("#g-newmem").value.trim(); if(!v) return;
      m.members.push({id:uid(), name:v}); renderModal(); ov.ownerDocument.querySelector("#g-newmem")?.focus(); };
    $("[data-addmem]").onclick = addMem;
    $("#g-newmem").onkeydown = e => { if(e.key==="Enter"){ e.preventDefault(); addMem(); } };
    ov.querySelectorAll("[data-delmem]").forEach(b => b.onclick = () => {
      sync(); const p = m.members[+b.dataset.delmem], uses = memberUsage().get(p.id);
      if(uses && uses.length){
        const list = [...new Set(uses)];
        $("#g-err").innerHTML = `Can't remove <b>${esc(p.name)}</b> yet. They're in ${list.slice(0,4).map(esc).join(", ")}${list.length>4?` and ${list.length-4} more`:""}. Change or delete ${list.length>1?"those":"that"} first, or just rename them.`;
        return;
      }
      m.members.splice(+b.dataset.delmem,1); renderModal(); });
    $("[data-savegroup]").onclick = async () => {
      sync();
      const pending = $("#g-newmem").value.trim(); if(pending) m.members.push({id:uid(), name:pending});
      const members = m.members.map(p=>({id:p.id, name:p.name.trim()})).filter(p=>p.name);
      if(!m.name.trim()) return $("#g-err").textContent = "Give the group a name.";
      if(members.length < 2) return $("#g-err").textContent = "Add at least two people to split with.";
      const id = m.id || uid();
      const existing = S.groups.find(x=>x.id===id);
      const ok = await write(() => S.store.saveGroup({id, name:m.name.trim(), currency:m.currency, members, createdAt: existing?.createdAt || Date.now()}), m.id?"Group updated":"Group created");
      if(ok){ closeModal(); selectGroup(id); }
    };
    const del = $("[data-delgroup]");
    if(del) del.onclick = () => {
      if(del.dataset.armed){ write(()=>S.store.deleteGroup(m.id), "Group deleted").then(ok=>{ if(ok){ closeModal(); S.gid=null; selectGroup((S.groups.find(x=>x.id!==m.id)||{}).id||null); }}); }
      else { del.dataset.armed="1"; del.textContent="Click again to delete everything"; }
    };
    if(!m.id) setTimeout(()=>$("#g-name")?.focus());
  }

  if(m.type==="expense"){
    const syncTop = () => {
      m.desc=$("#e-desc").value; m.amount=$("#e-amt").value; m.date=$("#e-date").value;
      m.paidBy=$("#e-paid").value; m.notes=$("#e-notes").value; m.bank=$("#e-bank").value;
    };
    const refreshSplit = () => {
      const comp = computeSplit(m, g);
      $("#e-status").innerHTML = splitStatus(comp, toCents(m.amount)||0, g, m);
      $("#e-amt-calc").innerHTML = calcPreview(m.amount, {currency:entryCur(m,g.currency)}); const cv = $("#e-conv"); if(cv) cv.textContent = convNote(m, g.currency);
      ov.querySelectorAll("[data-calc]").forEach(el => el.innerHTML = calcPreview(m.inputs[el.dataset.calc], {currency:entryCur(m,g.currency)}));
      if(m.splitType==="equal") ov.querySelectorAll(".sp:not(.allrow)").forEach((row,i)=>{ const id=g.members[i].id; const sh=row.querySelector(".share"); if(sh) sh.textContent = comp.splits[id]?money(comp.splits[id],entryCur(m,g.currency)):"—"; });
      ov.querySelectorAll("[data-preview]").forEach(el => { const c = comp.splits[el.dataset.preview]; el.textContent = c?money(c,entryCur(m,g.currency)):""; });
    };
    $("#e-amt").oninput = () => { m.amount = $("#e-amt").value; refreshSplit(); };
    ov.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { syncTop(); m.category=b.dataset.cat; ov.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("on",x===b)); });
    ov.querySelectorAll("[data-method]").forEach(b => b.onclick = () => {
      syncTop(); if(m.splitType===b.dataset.method) return;
      m.splitType=b.dataset.method;
      m.inputs = {};
      if(m.splitType==="equal") g.members.forEach(p=>m.inputs[p.id]=true);
      if(m.splitType==="shares") g.members.forEach(p=>m.inputs[p.id]="1");
      if(m.splitType==="percent"){ const n=g.members.length; g.members.forEach((p,i)=>m.inputs[p.id]= String(Math.round(10000/n)/100)); }
      renderModal();
    });
    ov.querySelectorAll("[data-split]").forEach(inp => {
      const h = () => { m.inputs[inp.dataset.split] = inp.type==="checkbox" ? inp.checked : inp.value; refreshSplit();
        const ab = ov.querySelector("[data-allsplit]"); if(ab && inp.type==="checkbox"){ const n = g.members.filter(p=>m.inputs[p.id]===true).length;
          ab.checked = n===g.members.length; ab.indeterminate = n>0 && n<g.members.length; const lab = ab.closest(".allrow").querySelector(".share"); if(lab) lab.textContent = `${n} of ${g.members.length} ticked`; } };
      inp.oninput = h; inp.onchange = h;
    });
    ov.querySelectorAll("[data-ecur]").forEach(b => b.onclick = () => { syncTop(); m.cur = b.dataset.ecur; renderModal(); });
    bindNewCat(ov, m, syncTop);
    bindAllRow(ov, g, m, "data-allsplit", () => { syncTop(); renderModal(); });
    $("[data-saveexp]").onclick = async () => {
      syncTop();
      const err = $("#e-err"); const total = toCents(m.amount);
      if(!m.desc.trim()) return err.textContent = "Add a short description.";
      if(!isFinite(total)) return err.textContent = "The amount isn't a number or sum I can read.";
      if(total<=0) return err.textContent = "Enter an amount above zero.";
      const comp = computeSplit(m, g);
      if(!comp.ok) return err.textContent =
        m.splitType==="exact" ? (comp.bad ? "One of the amounts isn't a sum I can read." : "The amounts need to add up to the total.") :
        m.splitType==="percent" ? "The percentages need to add up to 100%." :
        m.splitType==="shares" ? "Give at least one person a share." : "Pick at least one person to split with.";
      const id = m.id || uid();
      const inputs = {}; Object.entries(m.inputs).forEach(([k,v])=>{ if(v!==""&&v!==false&&v!=null) inputs[k]=v; });
      const base = toBase(total, entryCur(m, g.currency), g.currency);
      const baseSplits = base===total ? comp.splits : allocate(base, comp.splits);
      const ok = await write(() => S.store.saveExpense(g.id, {
        id, kind:"expense", desc:m.desc.trim(), amount:base, date:m.date||todayISO(), category:m.category, ...catTag(m.category),
        paidBy:m.paidBy, splitType:m.splitType, inputs, splits:baseSplits, notes:(m.notes||"").trim(), ...((m.bank||"").trim() ? {bank:m.bank.trim()} : {}),
        createdAt: m.createdAt || Date.now(), ...importTagsOf(S.expenses.find(x=>x.id===m.id)), ...origTag(m, g.currency, total)
      }), m.id?"Expense updated":"Expense added");
      if(ok) closeModal();
    };
    if(!m.id) setTimeout(()=>$("#e-desc")?.focus());
  }

  if(m.type==="settle"){
    $("#s-amt").oninput = () => { $("#s-calc").innerHTML = calcPreview($("#s-amt").value, {currency:entryCur(m,g.currency)}); $("#s-conv").textContent = convNote(m, g.currency, $("#s-amt").value); };
    ov.querySelectorAll("[data-scur]").forEach(b => b.onclick = () => { m.from=$("#s-from").value; m.to=$("#s-to").value; m.amount=$("#s-amt").value; m.date=$("#s-date").value; m.notes=$("#s-notes").value; m.cur = b.dataset.scur; renderModal(); });
    $("[data-savesettle]").onclick = async () => {
      const from=$("#s-from").value, to=$("#s-to").value, amount=toCents($("#s-amt").value);
      const err=$("#s-err");
      if(from===to) return err.textContent = "Pick two different people.";
      if(!isFinite(amount)) return err.textContent = "The amount isn't a number or sum I can read.";
      if(amount<=0) return err.textContent = "Enter an amount above zero.";
      const id = m.id || uid(), entered = amount, baseAmt = toBase(entered, entryCur(m, g.currency), g.currency);
      const ok = await write(() => S.store.saveExpense(g.id, {id, kind:"settle", from, to, amount:baseAmt, ...origTag(m, g.currency, entered),
        date:$("#s-date").value||todayISO(), notes:$("#s-notes").value.trim(), createdAt:m.createdAt||Date.now(), ...importTagsOf(S.expenses.find(x=>x.id===m.id))}), m.credit?"Credit added":"Payment recorded");
      if(ok) closeModal();
    };
  }

  const del = $("[data-delexp]");
  if(del) del.onclick = () => {
    if(del.dataset.armed) write(()=>S.store.deleteExpense(g.id, m.id), "Deleted").then(ok=>ok&&closeModal());
    else { del.dataset.armed="1"; del.textContent="Click again to delete"; }
  };
}

function newExpenseModal(){
  const g = group(); const inputs = {}; g.members.forEach(p=>inputs[p.id]=true);
  openModal({type:"expense", desc:"", amount:"", date:todayISO(), category:"food", paidBy:g.members[0].id, splitType:"equal", inputs, notes:""});
}
function editExpenseModal(e){
  const g = group();
  const oc = e.origCurrency && e.origAmount ? {cur:e.origCurrency, amount:fromCents(e.origAmount)} : {cur:g.currency};
  if(e.kind==="settle") return openModal({type:"settle", id:e.id, from:e.from, to:e.to, amount:fromCents(e.amount), date:e.date, notes:e.notes||"", createdAt:e.createdAt, ...oc});
  let inputs = {...(e.inputs||{})};
  if(isUnsplit(e)){
    inputs = {}; g.members.forEach(p=>inputs[p.id]=true);
    return openModal({type:"expense", id:e.id, desc:e.desc, amount:fromCents(e.amount), date:e.date, category:e.category||"other", bank:e.bank||"",
      paidBy:e.paidBy, splitType:"equal", inputs, notes:e.notes||"", createdAt:e.createdAt, wasUnsplit:true, ...oc});
  }
  if(!Object.keys(inputs).length){ // rebuild from splits if needed
    if(e.splitType==="equal") Object.keys(e.splits||{}).forEach(k=>inputs[k]=true);
    else { const sp = e.origAmount ? allocate(e.origAmount, e.splits||{}) : (e.splits||{}); Object.entries(sp).forEach(([k,c])=>inputs[k]=fromCents(c)); }
  }
  openModal({type:"expense", id:e.id, desc:e.desc, amount:fromCents(e.amount), date:e.date, category:e.category||"other", bank:e.bank||"",
    paidBy:e.paidBy, splitType:e.splitType||"exact", inputs, notes:e.notes||"", createdAt:e.createdAt, ...oc});
}

/* ---------- summary ---------- */
function summaryText(g){
  const {bal} = computeBalances(g, S.expenses);
  const real = S.expenses.filter(e=>e.kind!=="settle");
  const total = real.reduce((a,e)=>a+e.amount,0);
  const plan = simplify(bal);
  const lines = [`${g.name} — shared expenses`, `Total spent: ${moneyFull(total,g.currency)} across ${real.length} expenses`, ""];
  if(!plan.length) lines.push("Everyone is settled up 🎉");
  else { lines.push("To settle up:"); plan.forEach(p=>lines.push(`• ${memberName(g,p.from)} pays ${memberName(g,p.to)} ${moneyFull(p.amount,g.currency)}`)); }
  return lines.join("\n");
}

      h.setUint16(10,dosTime,true); h.setUint16(12,dosDate,true); h.setUint32(14,crc,true);
      h.setUint32(18,d.length,true); h.setUint32(22,d.length,true); h.setUint16(26,name.length,true); h.setUint16(28,0,true);

<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>
<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>
<xf numFmtId="165" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1" applyNumberFormat="1"/>

      {name:"xl/_rels/workbook.xml.rels", text:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join("")}<Relationship Id="rId${n+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`},

    const get = await unzip(buf);
    const P = s => new DOMParser().parseFromString(s, "application/xml");
    const T = (el,tag) => Array.from(el.getElementsByTagNameNS("*",tag));
    const wbx = await get("xl/workbook.xml"); if(!wbx) throw new Error("notxlsx");
    const relMap = {};
    const relx = await get("xl/_rels/workbook.xml.rels");
    if(relx) T(P(relx),"Relationship").forEach(r => relMap[r.getAttribute("Id")] = r.getAttribute("Target"));
    const ssx = await get("xl/sharedStrings.xml");
    const ss = ssx ? T(P(ssx),"si").map(si => T(si,"t").filter(t=>t.parentNode.localName!=="rPh").map(t=>t.textContent).join("")) : [];
    const sheets = [];
    for(const s of T(P(wbx),"sheet")){
      const rid = s.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id") || s.getAttribute("r:id");
      let target = relMap[rid] || "";
      target = target.startsWith("/") ? target.slice(1) : "xl/" + target.replace(/^\.\//,"");
      const x = await get(target); if(!x) continue;
      const rows = [];
      T(P(x),"row").forEach(r => {
        const ri = (+r.getAttribute("r") || rows.length+1) - 1;
        const row = rows[ri] = []; let ci = 0;
        T(r,"c").forEach(c => {
          const ref = c.getAttribute("r"); if(ref) ci = colIdx(ref.replace(/\d+/g,""));
          const t = c.getAttribute("t"), v = T(c,"v")[0]?.textContent;
          let val = "";
          if(t==="s") val = ss[+v] ?? "";
          else if(t==="inlineStr") val = T(c,"t").map(x=>x.textContent).join("");
          else if(t==="str" || t==="e") val = v ?? "";
          else if(t==="b") val = v==="1";
          else if(v!=null && v!=="") val = parseFloat(v);
          row[ci] = val; ci++;
        });
      });
      sheets.push({name:s.getAttribute("name")||"Sheet", rows:Array.from(rows, r=>r||[])});
    }
    return sheets;
  }
  function readCsv(text){
    text = text.replace(/^﻿/,"");
    const delim = (text.split("\n")[0].match(/;/g)||[]).length > (text.split("\n")[0].match(/,/g)||[]).length ? ";" : ",";
    const rows = []; let row = [], cur = "", q = false;
    for(let i=0;i<text.length;i++){
      const ch = text[i];
      if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; } else cur+=ch; }
      else if(ch==='"') q = true;
      else if(ch===delim){ row.push(cur); cur=""; }
      else if(ch==="\n"){ row.push(cur.replace(/\r$/,"")); rows.push(row); row=[]; cur=""; }
      else cur += ch;
    }
    if(cur || row.length){ row.push(cur.replace(/\r$/,"")); rows.push(row); }
    return [{name:"Expenses", rows}];
  }
  return {write, read, readCsv};
})();

const isoToSerial = iso => { const [y,m,d] = (iso||todayISO()).split("-").map(Number); return (Date.UTC(y,m-1,d) - Date.UTC(1899,11,30)) / 864e5; };
const serialToIso = n => new Date(Math.round((n - 25569) * 864e5)).toISOString().slice(0,10);
const colLetter = i => { let s=""; i++; while(i){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; };

function buildWorkbook(g){
  const H = v => ({v, s:3});
  const D = iso => ({v:isoToSerial(iso), s:1});
  const M = c => (c ? {v:c/100, s:2} : "");
  const exps = S.expenses.filter(e=>e.kind!=="settle").sort((a,b)=>(a.date||"").localeCompare(b.date||"") || (a.createdAt||0)-(b.createdAt||0));
  const pays = S.expenses.filter(e=>e.kind==="settle").sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const splitLabel = {equal:"Equal", exact:"Exact", percent:"Percent", shares:"Shares"};
  const head = ["Date","Description","Category","Paid by","Amount","Split","Notes", ...g.members.map(m=>m.name), "ID", "Bank"];
  const rows = [head.map(H)];
  exps.forEach(e => rows.push([D(e.date), e.desc, (CAT[e.category]||CAT.other).label, memberName(g,e.paidBy), M(e.amount),
    isUnsplit(e) ? "Not split" : splitLabel[e.splitType]||"Exact", e.notes||"", ...g.members.map(m => M((e.splits||{})[m.id]||0)), e.id, e.bank||""]));
  if(exps.length){
    const last = exps.length + 1, sum = col => ({f:`SUM(${col}2:${col}${last})`, s:4});
    const totals = [ "", {v:"TOTAL", s:5}, "", "", {...sum("E"), v:exps.reduce((a,e)=>a+e.amount,0)/100}, "", "" ];
    g.members.forEach((m,i) => { const col = colLetter(7+i); totals.push({...sum(col), v:exps.reduce((a,e)=>a+((e.splits||{})[m.id]||0),0)/100}); });
    rows.push([], totals);
  }
  const payRows = [["Date","From","To","Amount","Notes","ID"].map(H),
    ...pays.map(e => [D(e.date), memberName(g,e.from), memberName(g,e.to), M(e.amount), e.notes||"", e.id])];
  const {bal, paid, share} = computeBalances(g, S.expenses);
  const balRows = [["Person","Paid for group","Share of expenses","Payments made","Payments received","Balance","Status"].map(H),
    ...g.members.map(m => {
      const sent = pays.filter(e=>e.from===m.id).reduce((a,e)=>a+e.amount,0), recv = pays.filter(e=>e.to===m.id).reduce((a,e)=>a+e.amount,0);
      const v = bal[m.id]||0;
      return [m.name, {v:(paid[m.id]||0)/100,s:2}, {v:(share[m.id]||0)/100,s:2}, {v:sent/100,s:2}, {v:recv/100,s:2}, {v:v/100,s:4}, v>0?"Gets back":v<0?"Owes":"Settled up"];
    })];
  simplify(bal).forEach((p,i) => { if(i===0) balRows.push([], [{v:"To settle up",s:5}]); balRows.push([`${memberName(g,p.from)} pays ${memberName(g,p.to)}`, {v:p.amount/100,s:2}]); });
  return XL.write([
    {name:"Expenses", rows, widths:[12,30,16,14,12,9,24, ...g.members.map(()=>12), 16]},
    {name:"Payments", rows:payRows, widths:[12,14,14,12,24,16]},
    {name:"Balances", rows:balRows, widths:[24,15,17,15,17,12,12]}
  ]);
}

  if(dl){

    catch(e){ if(e && e.code!=="declined") toast("Couldn't download the file here."); }

  }
  try {
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  } catch { toast("Downloads aren't available here."); }
}

/* ---------- Excel import ---------- */
const nrm = s => String(s ?? "").trim().toLowerCase().replace(/\s+/g," ");
/* header text → comparable key: drops "(AED)", currency words, punctuation */
const hkey = s => nrm(s).replace(/\(.*?\)/g," ").replace(/\b(aed|usd|eur|gbp|inr|php|sar|in)\b/g," ").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
const HEAD = {
  date:["date","day","when","transaction date","txn date","trans date","posting date","value date","expense date","purchase date","date of expense"],
  desc:["description","expense","item","what","details","detail","name","title","particulars","narration","merchant","expense details","purpose","for","transaction","transaction details","description details","payee","vendor","shop","store"],
  cat:["category","type"], paid:["paid by","payer","paidby","who paid","paid from"],
  amount:["amount","total","cost","price","value","debit","debit amount","spent","expense amount","amt","sum","total amount","withdrawal","withdrawals"],
  split:["split","split type","method"],
  notes:["notes","note","comment","comments","remarks","memo","reference","ref"], id:["id"],
  from:["from","payer","paid by","who paid"], to:["to","payee","paid to","receiver"]
};
function cellCents(v){
  if(typeof v==="number") return Math.round(v*100);
  if(v==null || String(v).trim()==="") return null;
  const c = toCents(String(v).replace(/[A-WYZa-wyz$€£₹₱]/g,"").trim());
  return isFinite(c) ? c : NaN;
}
function cellDate(v){
  if(typeof v==="number" && v>20000 && v<80000) return serialToIso(v);
  const s = String(v ?? "").trim(); if(!s) return todayISO();
  let m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,"0")}-${m[3].padStart(2,"0")}`;
  m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);
  if(m){ let [a,b,y] = [+m[1],+m[2],+m[3]]; if(y<100) y += 2000; let d=a, mo=b; if(b>12 && a<=12){ d=b; mo=a; }
    if(mo>=1&&mo<=12&&d>=1&&d<=31) return `${y}-${String(mo).padStart(2,"0")}-${String(d).padStart(2,"0")}`; }
  const t = Date.parse(s); if(!isNaN(t)){ const d=new Date(t); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
  return null;
}
function catKey(v){
  const s = nrm(v); if(!s) return "other";
  const hit = CATEGORIES.find(([k,,l]) => s===k || s===nrm(l) || nrm(l).startsWith(s) || s.startsWith(k));
  return hit ? hit[0] : "other";
}
function findHeader(rows, need){
  for(let i=0;i<Math.min(rows.length,20);i++){
    const r = (rows[i]||[]).map(hkey);
    if(need.every(k => r.some(c => HEAD[k].includes(c)))) return i;
  }
  return -1;
}
/* No header row? Work out which column is the date, the amount and the description from the values. */
function inferColumns(rows){
  const data = rows.filter(r => r && r.some(c => c!=="" && c!=null)).slice(0, 50);
  if(!data.length) return null;
  const width = Math.max(...data.map(r=>r.length));
  const score = [];
  for(let j=0;j<width;j++){
    let dates=0, nums=0, texts=0, filled=0, len=0;
    data.forEach(r => { const v = r[j]; if(v==="" || v==null) return; filled++;
      if(typeof v==="number"){ if(v>20000 && v<80000 && Number.isInteger(v)) dates++; else nums++; }
      else { const s = String(v).trim();
        if(/^\d{1,4}[-\/.]\d{1,2}[-\/.]\d{2,4}$/.test(s) || (!/^[-\d.,\s]+$/.test(s) && !isNaN(Date.parse(s)) && /\d/.test(s))) dates++;
        else if(isFinite(cellCents(s)) && /\d/.test(s) && !/[a-z]{4,}/i.test(s)) nums++;
        else { texts++; len += s.length; } } });
    score.push({j, dates, nums, texts, filled, len});
  }
  const best = (k, used) => score.filter(s=>!used.includes(s.j) && s[k] >= Math.max(1, s.filled*0.6)).sort((a,b)=>b[k]-a[k] || (k==="texts"?b.len-a.len:0))[0];
  const used = [];
  const d = best("dates", used); if(d) used.push(d.j);
  const a = best("nums", used); if(a) used.push(a.j);
  const t = best("texts", used); if(t) used.push(t.j);
  if(!a || !t) return null;
  const hdr = []; hdr[a.j] = "Amount"; hdr[t.j] = "Description"; if(d) hdr[d.j] = "Date";
  const rest = score.filter(s=>!used.includes(s.j) && s.texts>0).sort((x,y)=>y.len-x.len)[0];
  if(rest) hdr[rest.j] = "Notes";
  for(let j=0;j<width;j++) if(hdr[j]==null) hdr[j] = "";
  return hdr;
}
function planImport(sheets, g, opts = {}){
  const plan = {expenses:[], payments:[], newMembers:[], problems:[], updates:0, unsplit:0, noPayer:0};
  const byName = new Map(g.members.map(m=>[nrm(m.name), m]));
  const member = name => {
    const k = nrm(name); if(!k) return null;
    if(!byName.has(k)){ const m = {id:uid(), name:String(name).trim()}; byName.set(k,m); plan.newMembers.push(m); }
    return byName.get(k);
  };
  const existing = new Map(S.expenses.map(e=>[e.id,e]));
  let expSheet = sheets.find(s=>nrm(s.name)==="expenses" && findHeader(s.rows,["desc","amount"])>=0)
    || sheets.find(s=>findHeader(s.rows,["desc","amount"])>=0);
  let hi = expSheet ? findHeader(expSheet.rows, ["desc","amount"]) : -1;
  let hdr;
  if(hi >= 0) hdr = expSheet.rows[hi];
  else {
    expSheet = sheets.find(s=>nrm(s.name)==="expenses") || sheets[0];
    hdr = expSheet && inferColumns(expSheet.rows);
    if(!hdr){ plan.problems.push("Couldn't find the Description and Amount columns. Add a header row with “Date”, “Description” and “Amount”."); return plan; }
    hi = -1; plan.inferred = true;
  }
  const col = {}, memberCols = [], extraText = [];
  const known = new Set(g.members.map(m=>nrm(m.name)));
  hdr.forEach((h,j) => {
    const raw = nrm(h), k = hkey(h); if(!raw) return;
    if(known.has(raw)){ memberCols.push([j, String(h).trim()]); return; }
    const key = ["date","desc","cat","paid","amount","split","bank","notes","id"].find(f => HEAD[f].includes(k) && col[f]==null);
    if(key){ col[key] = j; return; }
    if(HEAD.desc.includes(k) || HEAD.notes.includes(k)){ extraText.push(j); return; }
    // An unknown column counts as a person only if it holds numbers (their shares)
    const vals = expSheet.rows.slice(hi+1).map(r => (r||[])[j]).filter(v => v!=="" && v!=null);
    if(vals.length && vals.every(v => typeof v==="number" || /^[\s\d.,+\-*/()]+$/.test(String(v)))) memberCols.push([j, String(h).trim()]);
  });
  if(col.notes==null && extraText.length) col.notes = extraText.shift();
  const pending = [];
  for(let i=hi+1;i<expSheet.rows.length;i++){
    const r = expSheet.rows[i] || [];
    if(!r.some(c => c!=="" && c!=null)) continue;
    const at = `Row ${i+1}`;
    const desc = String(r[col.desc] ?? "").trim();
    const paidName = col.paid!=null ? String(r[col.paid] ?? "").trim() : "";
    if(/^(grand )?totals?$/i.test(desc) && !paidName) continue;
    const rawAmt = cellCents(r[col.amount]);
    const amount = (rawAmt!=null && isFinite(rawAmt)) ? Math.abs(rawAmt) : rawAmt;
    if(!desc){ plan.problems.push(`${at}: no description`); continue; }
    if(amount==null || !isFinite(amount) || amount<=0){ plan.problems.push(`${at} (${desc}): amount is missing or not a number`); continue; }
    if(!paidName){
      plan.noPayer++;
      if(!opts.defaultPayer){ plan.problems.push(`${at} (${desc}): “Paid by” is empty`); continue; }
    }
    const date = col.date!=null ? cellDate(r[col.date]) : todayISO();
    if(!date){ plan.problems.push(`${at} (${desc}): can't read the date “${r[col.date]}”`); continue; }
    const shares = []; let bad = false;
    for(const [j,name] of memberCols){
      const c = cellCents(r[j]);
      if(c==null) continue;
      if(!isFinite(c) || c<0){ bad = true; plan.problems.push(`${at} (${desc}): ${name}'s share “${r[j]}” isn't a number`); break; }
      if(c>0) shares.push([name,c]);
    }
    if(bad) continue;
    const sum = shares.reduce((a,[,c])=>a+c,0);
    if(shares.length && sum!==amount){ plan.problems.push(`${at} (${desc}): shares add up to ${money(sum,g.currency)} but the amount is ${money(amount,g.currency)}`); continue; }
    const idv = col.id!=null ? String(r[col.id] ?? "").trim() : "";
    const prev = idv && existing.get(idv)?.kind!=="settle" ? existing.get(idv) : null;
    pending.push({id: prev ? prev.id : uid(), createdAt: prev?.createdAt || Date.now()+i, desc, amount, date,
      category: col.cat!=null ? catKey(r[col.cat]) : "other", ...catTag(col.cat!=null ? catKey(r[col.cat]) : "other"), paidBy: paidName ? member(paidName).id : opts.defaultPayer,
      notes: [col.notes, ...extraText].filter(j=>j!=null).map(j=>String(r[j] ?? "").trim()).filter(Boolean).join(" · "),
      splitHint: col.split!=null ? nrm(r[col.split]) : "",
      bank: col.bank!=null ? String(r[col.bank] ?? "").trim() : "",
      shares: shares.map(([n,c]) => [member(n).id, c])});
    if(prev) plan.updates++;
  }
  const allIds = [...g.members, ...plan.newMembers].map(m=>m.id);
  for(const p of pending){
    if(!p.shares.length) plan.noShares = (plan.noShares||0) + 1;
    let splits, splitType, inputs = {};
    if(!p.shares.length && (opts.unsplit!=="equal" || p.splitHint.startsWith("not"))){
      plan.unsplit++;
      plan.expenses.push({id:p.id, kind:"expense", desc:p.desc, amount:p.amount, date:p.date, category:p.category, ...catTag(p.category), paidBy:p.paidBy,
        splitType:"equal", inputs:{}, splits:{}, needsSplit:true, notes:p.notes, createdAt:p.createdAt, ...(p.bank?{bank:p.bank}:{})});
      continue;
    }
    if(!p.shares.length){
      const w = {}; allIds.forEach(id=>w[id]=1); splits = allocate(p.amount, w); splitType = "equal"; allIds.forEach(id=>inputs[id]=true);
    } else {
      splits = Object.fromEntries(p.shares);
      const w = {}; p.shares.forEach(([id])=>w[id]=1); const eq = allocate(p.amount, w);
      if(p.splitHint.startsWith("equal") && p.shares.every(([id,c])=>eq[id]===c)){ splitType="equal"; p.shares.forEach(([id])=>inputs[id]=true); }
      else { splitType="exact"; p.shares.forEach(([id,c])=>inputs[id]=fromCents(c)); }
    }
    plan.expenses.push({id:p.id, kind:"expense", desc:p.desc, amount:p.amount, date:p.date, category:p.category, paidBy:p.paidBy,
      splitType, inputs, splits, notes:p.notes, createdAt:p.createdAt, ...(p.bank?{bank:p.bank}:{})});
  }
  const paySheet = sheets.find(s=>nrm(s.name)==="payments");
  if(paySheet){
    const ph = findHeader(paySheet.rows, ["from","to"]);
    if(ph >= 0){
      const h = paySheet.rows[ph].map(nrm), pc = k => h.findIndex(c => HEAD[k].includes(c));
      const cF=pc("from"), cT=pc("to"), cA=pc("amount"), cD=pc("date"), cN=pc("notes"), cI=pc("id");
      for(let i=ph+1;i<paySheet.rows.length;i++){
        const r = paySheet.rows[i] || []; if(!r.some(c=>c!==""&&c!=null)) continue;
        const at = `Payments row ${i+1}`, fromN = String(r[cF]??"").trim(), toN = String(r[cT]??"").trim(), amt = cellCents(r[cA]);
        if(!fromN || !toN || nrm(fromN)===nrm(toN)){ plan.problems.push(`${at}: needs two different people in From and To`); continue; }
        if(amt==null || !isFinite(amt) || amt<=0){ plan.problems.push(`${at}: amount is missing or not a number`); continue; }
        const date = cD>=0 ? cellDate(r[cD]) : todayISO();
        const idv = cI>=0 ? String(r[cI]??"").trim() : "";
        const prev = idv && existing.get(idv)?.kind==="settle" ? existing.get(idv) : null;
        if(prev) plan.updates++;
        plan.payments.push({id: prev?prev.id:uid(), kind:"settle", from:member(fromN).id, to:member(toN).id, amount:amt,
          date: date||todayISO(), notes: cN>=0 ? String(r[cN]??"").trim() : "", createdAt: prev?.createdAt || Date.now()+i});
      }
    }
  }
  return plan;
}

function pickImportFile(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".xlsx,.csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,text/csv";
  inp.style.display = "none";
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; inp.remove(); if(!f) return;
    const g = group(); if(!g) return;
    try {
      let sheets;
      if(/\.csv$/i.test(f.name)) sheets = XL.readCsv(await f.text());
      else if(/\.xls$/i.test(f.name)) return toast("That's an old .xls file. Save it as .xlsx in Excel first, then import.");
      else sheets = await XL.read(await f.arrayBuffer());
      const opts = {unsplit:"leave", defaultPayer:g.members[0].id};
      openModal({type:"import", fileName:f.name, sheets, opts, plan:planImport(sheets, g, opts)});
    } catch { toast("Couldn't read that file. Is it an Excel (.xlsx) or CSV file?"); }
  };
  document.body.appendChild(inp); inp.click();
}

function downloadTemplate(g){
  const H = v => ({v, s:3});

  const ex = templateRows(g).map(r => [{v:isoToSerial(r[0]), s:1}, r[1], r[2], r[3], {v:r[4], s:2}, ""]);
  const info = [
    [{v:"How to fill in the Expenses sheet", s:5}], [],
    ["Column","What to put"].map(H),
    ["Date","The date of the expense (e.g. 2026-10-31). Empty = today."],
    ["Description","Required. What the expense was for."],
    ["Category", CATEGORIES.map(c=>c[2]).join(", ")],

/* ---------- statements ---------- */
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const fmtDay = iso => { const [y,m,d] = (iso||todayISO()).split("-").map(Number); return `${d} ${MONTHS[m-1]} ${y}`; };
const moneyPlain = (c, cur) => `${c<0?"-":""}${cur} ${(Math.abs(c)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}`;

function periodRange(st){
  const t = todayISO(), [y,m] = t.split("-").map(Number);
  const pad = n => String(n).padStart(2,"0");
  const lastDay = (yy,mm) => new Date(Date.UTC(yy,mm,0)).getUTCDate();
  if(st.period==="this-month") return {from:`${y}-${pad(m)}-01`, to:`${y}-${pad(m)}-${lastDay(y,m)}`, label:`${MONTHS[m-1]} ${y}`};
  if(st.period==="last-month"){ const yy = m===1?y-1:y, mm = m===1?12:m-1; return {from:`${yy}-${pad(mm)}-01`, to:`${yy}-${pad(mm)}-${lastDay(yy,mm)}`, label:`${MONTHS[mm-1]} ${yy}`}; }
  if(st.period==="custom"){
    const from = st.from || "", to = st.to || "";
    return {from, to, label: from&&to ? `${fmtDay(from)} – ${fmtDay(to)}` : from ? `From ${fmtDay(from)}` : to ? `Up to ${fmtDay(to)}` : "All dates"};
  }
  return {from:"", to:"", label:"All dates"};
}

function buildStatement(g, mid){
  const st = S.stmt, r = periodRange(st);
  const inP = dt => (!r.from || (dt||"") >= r.from) && (!r.to || (dt||"") <= r.to);
  const items = S.expenses.filter(e => !isUnsplit(e));
  const effect = e => e.kind==="settle"
    ? (e.to===mid ? e.amount : 0) - (e.from===mid ? e.amount : 0)
    : ((e.splits||{})[mid]||0) - (e.paidBy===mid ? e.amount : 0);
  const broughtForward = r.from ? items.filter(e => (e.date||"") < r.from).reduce((a,e)=>a+effect(e),0) : 0;
  const per = items.filter(e => inP(e.date)).sort((a,b)=>(a.date||"").localeCompare(b.date||"") || (a.createdAt||0)-(b.createdAt||0));
  const charges = per.filter(e => e.kind!=="settle" && ((e.splits||{})[mid]||0) > 0)
    .map(e => ({id:e.id, date:e.date, desc:e.desc, cat:(CAT[e.category]||CAT.other).label, paidBy:memberName(g,e.paidBy), total:e.amount, share:e.splits[mid]}));
  const credits = [];
  per.forEach(e => {
    if(e.kind==="settle" && e.from===mid) credits.push({id:e.id, date:e.date, details:e.notes || "Payment", by:`Received by ${memberName(g,e.to)}`, amount:e.amount});
    else if(e.kind!=="settle" && e.paidBy===mid) credits.push({id:e.id, date:e.date, details:`Paid for “${e.desc}”`, by:"Paid on behalf of the group", amount:e.amount});
  });
  const received = per.filter(e => e.kind==="settle" && e.to===mid)
    .map(e => ({id:e.id, date:e.date, details:e.notes || "Payment", by:`From ${memberName(g,e.from)}`, amount:e.amount}));
  const sum = a => a.reduce((x,y)=>x+(y.share ?? y.amount),0);
  const tCharges = sum(charges), tCredits = sum(credits), tReceived = sum(received);
  const payable = broughtForward + tCharges - tCredits + tReceived;
  const unsplit = S.expenses.filter(e => isUnsplit(e) && inP(e.date)).length;
  // Who pays whom, from everyone's balances up to the end of the period, keeping only lines involving this person
  const upTo = S.expenses.filter(e => !r.to || (e.date||"") <= r.to);
  const settle = simplify(computeBalances(g, upTo).bal)
    .filter(p => p.from===mid || p.to===mid)
    .map(p => ({from:memberName(g,p.from), to:memberName(g,p.to), amount:p.amount, pays:p.from===mid}));
  const asOf = r.to && r.to < todayISO() ? r.to : todayISO();
  return {member:g.members.find(m=>m.id===mid), range:r, broughtForward, charges, credits, received, tCharges, tCredits, tReceived, payable, unsplit, settle, asOf};
}

  }
  return d.blob();
}

/* ---------- your share of Split & Share expenses, shown in Daily Spending ---------- */
S.groupExp = {}; let _allSpend = null, gxTimer = null;

function sharedItems(){
  const st = S.settings || {}; if(st.sharedAll === false) return [];
  const hid = st.sharedHidden || {}, off = st.sharedOff || {}, out = [];
  for(const g of S.groups){
    if(off[g.id]) continue; const ex = S.groupExp[g.id]; if(!ex || !g.members || !g.members.length) continue;
    const me = meIn(g);
    for(const e of ex){
      if(!e || e.kind==="settle" || isUnsplit(e)) continue;
      const c = (e.splits||{})[me.id] || 0; if(c <= 0) continue;
      const key = `${g.id}__${e.id}`; if(hid[key]) continue;
      out.push({id:"sh:"+key, key, shared:true, gid:g.id, eid:e.id, gname:g.name, type:"expense", date:e.date, desc:e.desc,
        amount:toBase(c, g.currency, PC()), share:c, total:e.amount, gcur:g.currency, category:e.category||"other", payerMe:e.paidBy===me.id, bankPaid:!!(e.bank||"").trim(),
        method:"Shared", notes:"", payer:memberName(g, e.paidBy), createdAt:e.createdAt||0});
    }

function monthTotals(ym){
  let spent = 0, income = 0, shared = 0; const byCat = {}, list = [];
  for(const t of allSpend()){ if(monthOf(t.date)!==ym) continue; list.push(t);
    if(t.type==="income") income += t.amount; else { spent += t.amount; if(t.shared) shared += t.amount; const c = t.category||"other"; byCat[c] = (byCat[c]||0) + t.amount; } }
  return {spent, income, shared, byCat, list};
}
function avgMonthlySpend(n = 3){
  const cm = thisMonth(); let tot = 0, cnt = 0;
  for(let i=1;i<=n;i++){ const t = monthTotals(addMonths(cm,-i)); if(t.list.length){ tot += t.spent; cnt++; } }
  if(!cnt){ const t = monthTotals(cm); return t.spent; }
  return Math.round(tot/cnt);
}

/* ---------- personal storage (private to each person) ---------- */
function makeCloudPersonal(db, userId){
  const base = db.doc(`data/users/${userId}/me`), setRef = db.doc(`data/users/${userId}/settings`);
  const list = s => s.docs.map(d => ({...d.data(), id:d.id}));
  return {
    mode:"cloud",
    sub(name, cb, err){ return base.collection(name).onSnapshot(s => cb(list(s), s.metadata), err); },
    save(name, item){ const {id, ...rest} = item; return base.collection(name).doc(id).set(rest); },
    del(name, id){ return base.collection(name).doc(id).delete(); },
    subSettings(cb, err){ return setRef.onSnapshot(s => cb(s.exists ? s.data() : {}, s.metadata), err); },
    saveSettings(o){ return setRef.set(o); }
  };
}
function makeLocalPersonal(){
  const KEY = "cashnest-personal-v1";
  let data = null; try { data = JSON.parse(localStorage.getItem(KEY) || "null"); } catch {}
  data = data || {spending:{}, goals:{}, settings:{}};
  const L = {}; const meta = {fromCache:false, hasPendingWrites:false};
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} };
  const emit = name => (L[name]||new Set()).forEach(f => f(name==="settings" ? data.settings : Object.values(data[name]||{}), meta));
  const on = (name, cb) => { (L[name] ||= new Set()).add(cb); setTimeout(()=>cb(name==="settings" ? data.settings : Object.values(data[name]||{}), meta)); return () => L[name].delete(cb); };
  return {
    mode:"local",
    sub(name, cb){ return on(name, cb); },
    async save(name, item){ (data[name] ||= {})[item.id] = item; persist(); emit(name); },
    async del(name, id){ if(data[name]) delete data[name][id]; persist(); emit(name); },
    subSettings(cb){ return on("settings", cb); },
    async saveSettings(o){ data.settings = o; persist(); emit("settings"); }
  };
}
let pTimer = null;
function subscribePersonal(){
  const got = {spending:false, goals:false, settings:false, loans:false};
  const done = k => { got[k] = true; if(got.spending && got.goals && got.settings && got.loans){ S.pLoaded = true; clearTimeout(pTimer); S.pStale = false; } };
  const err = e => { clearTimeout(pTimer); S.pLoaded = true; toast(e && e.code==="revoked" ? "This page can no longer reach your saved data." : "Couldn't load your personal data right now."); render(); };
  pTimer = setTimeout(()=>{ S.pStale = true; S.pLoaded = true; render(); }, 10000);
  S.pStore.sub("spending", list => { S.spend = list.filter(t => t && typeof t.amount==="number"); done("spending"); render(); }, err);
  S.pStore.sub("goals", list => { S.goals = list.filter(x => x && x.name).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); done("goals"); render(); }, err);
  S.pStore.subSettings(o => { S.settings = o || {}; done("settings"); render(); }, err);
  S.pStore.sub("loans", list => { S.loans = list.filter(x => x && x.name && typeof x.principal==="number").sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); done("loans"); render(); }, err);
}
async function writeP(fn, okMsg){
  try { await fn(); if(okMsg) toast(okMsg); return true; }
